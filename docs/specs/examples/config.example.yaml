# Sorage (소라게) configuration example — SOT v0.4.0
#
# This file shows every key in ../schemas/config.schema.json at its normative
# default, which is exactly what `sorage config show --json` returns on a fresh
# installation (CFG-020). Only `installationId` differs, because `sorage init`
# generates a new random UUID for every installation.
#
# Comments and key order are preserved by `sorage config set` and
# `sorage config edit` (CFG-018), so annotations like these survive edits.
#
# Milestones: M1 CLI core · M2 daemon, HTTP API, Web UI · M3 Git backup,
# scheduling, packaging. A key belonging to a later milestone is inert until
# that milestone ships.

# Milestone M1 — identity and schema
schemaVersion: 1
configRevision: 1
installationId: "9d57384c-030e-4ff7-90ca-c615d8043db2"

# Milestone M1 — Vault. Never relocate a non-empty Vault by editing `path`;
# use `sorage vault move --to <path> --as-user` (CFG-013, CFG-014).
vault:
  path: "~/.sorage/vault"
  importMode: "copy"

# Milestone M2 — loopback daemon. `host` accepts only "127.0.0.1" and "::1";
# a `host` or `port` change requires `sorage daemon restart` (RUN-008).
server:
  host: "127.0.0.1"
  port: 46321
  autoStart: false
  openBrowserOnStart: false

# Milestone M1 — sender and discovery policy. `inboxMarker` writes the derived
# marker `.sorage/INBOX.md` into each recipient binding directory; recipients
# should git-ignore `.sorage/` (HND-026).
handoff:
  allowUnregisteredSenders: true
  requireRegisteredRecipient: true
  inboxMarker: false

# Milestone M1 — Artifact policy. `maxBytes` is enforced mid-stream during
# import, never after buffering (NFR-005).
artifact:
  maxBytes: 104857600
  externalSourcePolicy: "workspace_or_explicit"
  verifyChecksumOnFetch: false

# Milestone M3 — Git backup, disabled in a M1 installation. Set `timezone` to
# a local IANA zone such as "Asia/Seoul" once a daily schedule is enabled; push
# is toggled with `sorage backup enable-push` / `disable-push` (BKP-025).
# `snapshot.redactWorkspacePaths` keeps local paths out of the exported
# snapshots and out of the restored event ledger.
gitBackup:
  enabled: false
  schedule:
    type: "daily"
    at: "03:00"
    timezone: "UTC"
    catchUpAfterMissedRun: true
  commit:
    messageTemplate: "sorage backup: {timestamp}"
  push:
    enabled: false
    remote: "origin"
    branch: "main"
  largeArtifactWarningBytes: 26214400
  snapshot:
    redactWorkspacePaths: true

# Milestone M1 — presentation. `timezone: null` renders timestamps in the
# system zone; storage is always UTC (NFR-007).
ui:
  defaultPageSize: 50
  showArchivedByDefault: false
  timezone: null

# Milestone M1 — structured JSON logs at ~/.sorage/logs/sorage.log. Tokens and
# credentials are never logged at any level (SEC-010, RUN-009).
logging:
  level: "warn"
  includeFullPaths: false
  rotation:
    maxBytes: 10485760
    maxFiles: 5

# Milestone M1 — garbage collection. Sweeping runs only after the pending
# intent drain and never touches a path referenced by an intent (VLT-013).
gc:
  graceHours: 24
