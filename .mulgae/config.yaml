version: 3
project:
  name: "sorage"
providers:
  zcode: {}
  agy: {}
execution:
  workspace_access: "none"
roles:
  logic: {enabled: true, primary_provider: "zcode"}
  security: {enabled: false, primary_provider: "zcode"}
  maintainability: {enabled: false, primary_provider: "zcode"}
  product: {enabled: false, primary_provider: "zcode"}
  documentation: {enabled: false, primary_provider: "agy"}
  testing: {enabled: false, primary_provider: "zcode"}
review:
  required_roles: ["logic"]
  request_changes_on: ["high", "critical", "blocker"]
validation:
  evidence:
    require_verified_for: ["high", "critical", "blocker"]
  repair:
    enabled: true
    max_attempts: 1
    same_provider: true
  extraction:
    enabled: true
resources:
  max_active_lanes: 1
  primary_repair_attempts: 1
  role_max_invocations: 2
  run_max_invocations: 2
ci:
  fail_on_severity: ["high", "critical", "blocker"]
  degraded_review_fails: true
