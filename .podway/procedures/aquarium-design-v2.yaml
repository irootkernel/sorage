schema: podway.procedure/v2
id: aquarium-design-v2
version: "8"
name: Aquarium Design
purpose: Shape one approved project, feature epic, or refactor document set without implementing it.
description: A Podway record of Aquarium context capture, Ouroboros discovery, drafting, challenge, guarded quality review, exact-diff approval, document application, and closeout.
goal_tracking: true
node_definitions:
  context-record:
    type: action
    title: Capture design authority
    intent: Bind the workflow to its canonical identity, source authority, scope, and approved provider boundary.
    instructions:
      - Use the invoking design skill to record exact repository, document authority, scope, and approved discovery boundary.
      - Do not implement product behavior, mutate unapproved files, or publish. Staging and committing approved documents require the shared separately authorized task-commit boundary.
      - Deliver the complete original artifacts, exact target, requirements, checks and effect boundaries in aquarium.worker-handoff/v1. Accept its authentic current native result and receipt before separate Action completion; Worker delivery is not Judge passage or Primary acceptance.
    items:
      - id: context-summary
        type: text
        prompt: Record canonical identity, source paths and digests, approved operations, exclusions, and evidence gaps.
        required: true
        min_length: 1
        max_length: 5000
        multiline: true
      - id: worker-handoff
        type: artifact
        prompt: Reference the complete aquarium.worker-handoff/v1 candidate, exact target, requirement basis, checks, authority, gaps and authentic native result bindings.
        required: true
        allowed_media_types:
          - application/json
  discovery-record:
    type: action
    title: Record Ouroboros discovery
    intent: Record bounded requirements and decision evidence returned by approved leaf operations.
    instructions:
      - Use the approved Ouroboros discovery leaf and independently verify its bounded requirements evidence.
      - Discovery does not authorize implementation or applying draft documents.
      - Deliver the complete original artifacts, exact target, requirements, checks and effect boundaries in aquarium.worker-handoff/v1. Accept its authentic current native result and receipt before separate Action completion; Worker delivery is not Judge passage or Primary acceptance.
    items:
      - id: discovery-summary
        type: text
        prompt: Record provider operation IDs, adjudicated requirements, decisions, open questions, and bounded source references.
        required: true
        min_length: 1
        max_length: 6000
        multiline: true
      - id: worker-handoff
        type: artifact
        prompt: Reference the complete aquarium.worker-handoff/v1 candidate, exact target, requirement basis, checks, authority, gaps and authentic native result bindings.
        required: true
        allowed_media_types:
          - application/json
  draft-record:
    type: action
    title: Record the proposed design
    intent: Bind quality review to one exact draft and its unresolved constraints.
    instructions:
      - Draft only the approved design documents and preserve target paths, alternatives, and unresolved constraints.
      - Do not apply the draft or implement source behavior.
      - Deliver the complete original artifacts, exact target, requirements, checks and effect boundaries in aquarium.worker-handoff/v1. Accept its authentic current native result and receipt before separate Action completion; Worker delivery is not Judge passage or Primary acceptance.
    items:
      - id: draft-summary
        type: text
        prompt: Record target paths, draft digests, work-unit identity, and unresolved constraints.
        required: true
        min_length: 1
        max_length: 5000
        multiline: true
      - id: worker-handoff
        type: artifact
        prompt: Reference the complete aquarium.worker-handoff/v1 candidate, exact target, requirement basis, checks, authority, gaps and authentic native result bindings.
        required: true
        allowed_media_types:
          - application/json
  challenge-record:
    type: action
    title: Challenge the proposed design
    intent: Test the current draft against counterarguments, uncertainty, and missing evidence before quality review.
    instructions:
      - Challenge the exact draft with relevant counterarguments and missing evidence without changing source behavior.
      - Return bounded findings to the design owner; do not infer approval.
      - Deliver the complete original artifacts, exact target, requirements, checks and effect boundaries in aquarium.worker-handoff/v1. Accept its authentic current native result and receipt before separate Action completion; Worker delivery is not Judge passage or Primary acceptance.
    items:
      - id: counterarguments
        type: list
        prompt: Record the material counterarguments or alternative designs considered.
        required: true
        min_items: 1
        max_items: 20
        max_item_length: 1000
        max_total_length: 20000
        unique: true
      - id: uncertainty
        type: text
        prompt: Record material uncertainty, evidence limitations, and what could change the design.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: worker-handoff
        type: artifact
        prompt: Reference the complete aquarium.worker-handoff/v1 candidate, exact target, requirement basis, checks, authority, gaps and authentic native result bindings.
        required: true
        allowed_media_types:
          - application/json
  quality-record:
    type: action
    title: Record Ouroboros quality evidence
    intent: Record the QA result and local adjudication for the current draft.
    instructions:
      - Use the approved quality capability on the exact draft and adjudicate findings against repository authority.
      - A passing record does not authorize document application, staging, commit, or implementation.
      - Preserve the raw QA PASS, REVISE, or FAIL verdict and exact draft identity in quality-summary. A completed locally adjudicable operation records pass; record every unresolved valid issue in its owner count and list.
      - Route content findings to their owner before another QA pass. Artifact FAIL is not operation failure. Failed, missing, or non-adjudicable operation evidence records fail or inconclusive; retry unchanged input only through supported authorized recovery.
      - Deliver the complete original artifacts, exact target, requirements, checks and effect boundaries in aquarium.worker-handoff/v1. Accept its authentic current native result and receipt before separate Action completion; Worker delivery is not Judge passage or Primary acceptance.
    items:
      - id: quality-result
        type: check_result
        prompt: Record the caller-supplied result for aquarium-design-quality; Podway does not execute or attest the operation.
        help: The declared operation is "Review the current Aquarium design draft, challenge, authority, and trust claims outside Podway in the recorded input basis." The matching digest identifies only this abstract slot contract and does not prove that any operation ran.
        required: true
        operation_id: aquarium-design-quality
        operation_digest: sha256:3f51262cfcf3bb213105d52e1f2c41a79308d012001ad0832903e5ba72cefa89
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
      - id: quality-summary
        type: text
        prompt: Record QA operation IDs, findings, dispositions, and remaining evidence gaps.
        required: true
        min_length: 1
        max_length: 6000
        multiline: true
      - id: unresolved-discovery-findings
        type: integer
        prompt: Record the number of unresolved authority, source, or discovery findings.
        required: true
        minimum: 0
      - id: unresolved-draft-findings
        type: integer
        prompt: Record the number of unresolved draft, challenge, or trust-claim findings.
        required: true
        minimum: 0
      - id: discovery-findings
        type: list
        prompt: Record bounded unresolved authority, source, or discovery findings.
        required: false
        required_when:
          - item: unresolved-discovery-findings
            at_least: 1
        min_items: 1
        max_items: 20
        max_item_length: 1000
        max_total_length: 20000
        unique: true
      - id: draft-findings
        type: list
        prompt: Record bounded unresolved draft, challenge, or trust-claim findings.
        required: false
        required_when:
          - item: unresolved-draft-findings
            at_least: 1
        min_items: 1
        max_items: 20
        max_item_length: 1000
        max_total_length: 20000
        unique: true
      - id: quality-observations
        type: list
        prompt: Record failure or inconclusive quality-operation observations.
        required: false
        required_when:
          - item: quality-result
            field: outcome
            not_equals: pass
        min_items: 1
        max_items: 20
        max_item_length: 1000
        max_total_length: 20000
        unique: true
      - id: worker-handoff
        type: artifact
        prompt: Reference the complete aquarium.worker-handoff/v1 candidate, exact target, requirement basis, checks, authority, gaps and authentic native result bindings.
        required: true
        allowed_media_types:
          - application/json
  quality-decision:
    type: decision
    title: Evaluate design quality
    objective: Route each complete quality result to the phase that owns its correction.
    prompt: Is the current draft ready for exact-diff approval?
    evidence_guidance:
      - Read the draft identity, Ouroboros QA evidence, local adjudication, and unresolved constraints.
    options:
      - id: passed
        label: Quality passed
        criteria: The quality operation completed with adjudicable output and no unresolved discovery or draft finding remains.
        guards:
          - evidence:
              node: quality
              item: quality-result
            field: outcome
            equals: pass
          - evidence:
              node: quality
              item: unresolved-discovery-findings
            equals: 0
          - evidence:
              node: quality
              item: unresolved-draft-findings
            equals: 0
      - id: discovery-changes
        label: Discovery changes required
        criteria: At least one authority, source, or discovery finding remains.
        guards:
          - evidence:
              node: quality
              item: quality-result
            field: outcome
            equals: pass
          - evidence:
              node: quality
              item: unresolved-discovery-findings
            at_least: 1
      - id: draft-changes
        label: Draft changes required
        criteria: No discovery finding remains and at least one draft, challenge, or trust-claim finding remains.
        guards:
          - evidence:
              node: quality
              item: quality-result
            field: outcome
            equals: pass
          - evidence:
              node: quality
              item: unresolved-discovery-findings
            equals: 0
          - evidence:
              node: quality
              item: unresolved-draft-findings
            at_least: 1
      - id: incomplete
        label: Quality review incomplete
        criteria: The quality operation failed, returned no adjudicable output, or is inconclusive.
        guards:
          - evidence:
              node: quality
              item: quality-result
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Explain the decision from current evidence.
  approval-decision:
    type: decision
    title: Record exact-diff approval
    objective: Apply only the complete diff explicitly approved by the user.
    prompt: Did the user approve the displayed target paths and complete diff?
    evidence_guidance:
      - Compare the displayed diff with the current target snapshots.
    options:
      - id: approved
        label: Exact diff approved
        criteria: The user explicitly approved the complete displayed diff and targets have not changed.
      - id: changes-requested
        label: Changes requested
        criteria: The user rejected or changed the proposal, or a target snapshot changed.
    reason:
      required: true
      prompt: Record the user's decision and exact approved boundary.
  application-record:
    type: action
    title: Apply and validate documents
    intent: Record only approved document changes and current validation evidence.
    instructions:
      - Apply only the exact user-approved document diff to unchanged target paths and run current document validation.
      - Do not implement product code, publish, or extend document approval into commit authority. Use the shared separately authorized task-commit boundary when repository policy requires committed delivery input.
      - Deliver the complete original artifacts, exact target, requirements, checks and effect boundaries in aquarium.worker-handoff/v1. Accept its authentic current native result and receipt before separate Action completion; Worker delivery is not Judge passage or Primary acceptance.
      - Primary supplies the actual exact-diff approval and current snapshot basis. Recheck before any write. A changed proposal or target returns through original draft/investigation, challenge where applicable, quality and actual approval. Evidence-only re-entry verifies unchanged approved bytes without application authority for a changed diff.
    items:
      - id: application-summary
        type: text
        prompt: Record applied paths and digests, validation commands and outcomes, and unresolved constraints.
        required: true
        min_length: 1
        max_length: 6000
        multiline: true
      - id: worker-handoff
        type: artifact
        prompt: Reference the complete aquarium.worker-handoff/v1 candidate, exact target, requirement basis, checks, authority, gaps and authentic native result bindings.
        required: true
        allowed_media_types:
          - application/json
      - id: application-approval-result
        type: check_result
        prompt: Record the caller-supplied result for aquarium-design-application-approval; Podway does not execute or attest this check.
        help: Verify actual user approval of the complete exact current proposal or no-change, unchanged approved target snapshots before writes, applied bytes matching that approval and required validation. Changed proposals or targets require original quality and actual exact-diff approval again. Neither a Worker nor Judge verdict grants this authority.
        required: true
        operation_id: aquarium-design-application-approval
        operation_digest: sha256:395e4186c41d5296fec5ad178af052f6f897f41b0cb9a5e242da4b6c651da546
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  goal-assessment:
    type: decision
    title: Assess the design goal
    objective: Determine whether the approved document outcome was achieved without implementation.
    prompt: What is the outcome of the current design goal?
    evidence_guidance:
      - Read the approved diff, applied digests, validation, and unresolved constraints.
      - Use the current applicable final Judge report and fresh original native criterion statuses; every mandatory original criterion and integration obligation must pass.
      - Faithful negative checkpoints, zero provider findings and unsupported manual claims cannot establish whole-goal success.
    options:
      - id: achieved
        label: Goal achieved
        criteria: The exact approved documents are applied and all required validation is current.
        guards:
          - evidence:
              node: judge-design
              item: judge-goal-outcome
            equals: achieved
          - evidence:
              node: judge-design
              item: judge-verdict
            equals: pass
          - evidence:
              node: judge-design
              item: judge-unmet-criteria
            equals: 0
          - evidence:
              node: judge-design
              item: judge-unverified-criteria
            equals: 0
      - id: not-achieved
        label: Goal not achieved
        criteria: Required documents, validation, or unresolved constraints remain incomplete.
        guards:
          - evidence:
              node: judge-design
              item: judge-goal-outcome
            equals: not-achieved
      - id: superseded
        label: Goal superseded
        criteria: The desired design outcome has been replaced explicitly.
        guards:
          - evidence:
              node: judge-design
              item: judge-goal-outcome
            equals: superseded
    reason:
      required: true
      prompt: Explain the outcome using current artifact evidence.
    assessment:
      target: session_goal
      outcomes:
        achieved: achieved
        not-achieved: not_achieved
        superseded: superseded
  closeout-record:
    type: action
    title: Record design closeout
    intent: Record final artifacts, unresolved constraints, residue, commit authority, and publication state.
    instructions:
      - Record the exact applied design artifacts and remaining boundaries without claiming implementation completion.
      - Commit and publication remain separately authorized effects.
    items:
      - id: closeout-summary
        type: text
        prompt: Record final paths and digests, repository residue, commit if required, and publication state.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
  judge-context-record:
    type: action
    title: Assess the current candidate
    intent: Obtain a retained report-only Judge assessment from all original evidence and current phase obligations.
    instructions:
      - Read every original workflow criterion, current phase obligation, applicable parent constraint and original artifact directly. Retain one logical report-only Judge and its complete history throughout this invocation; a Worker summary or inherited verdict never replaces evidence.
      - Preserve all actual original criterion rows, global outcome verdict and unmet/unverified counts. The separate checkpoint result assesses the actual current phase obligations; later workflow work may remain unmet without inventing a global pass. Report completeness alone cannot establish correction or application success.
      - Accept a complete applicable native report without reassessing or recursively judging the Judge. Record all final items, retain idle state, obtain current Podway receipt, then complete separately with fresh fences.
      - Missing original criteria, stale targets, unreadable evidence or unsupported native role/configuration/task/result bindings prevent applicability. A Judge report supplies no effects, clipboard, application, implementation, installation, staging, commit or publication authority.
    items:
      - id: judge-assessment
        type: artifact
        prompt: Reference the complete aquarium.judge-assessment/v1 report and its exact digest; Podway stores metadata only.
        required: true
        allowed_media_types:
          - application/json
      - id: judge-verdict
        type: choice
        prompt: Record the Judge verdict.
        required: true
        choices:
          - pass
          - rework
          - evidence-needed
      - id: judge-unmet-criteria
        type: integer
        prompt: Count mandatory unmet criteria, including omitted original criteria.
        required: true
        minimum: 0
      - id: judge-unverified-criteria
        type: integer
        prompt: Count mandatory unverified criteria, including incomplete compound criteria.
        required: true
        minimum: 0
      - id: judge-applicability
        type: check_result
        prompt: Record the caller-supplied result for aquarium-design-diagnosis-judge-applicability; Podway does not execute or attest this check.
        help: Verify every original criterion and current phase obligation, applicable parent constraints and direct original evidence; exact current target, requirement basis, goal revision, placement and attempt; Worker result, retained logical Judge identity and complete history; authentic acknowledged role/configuration/task/result bindings and current receipt. Original negative rows and actual verdict/counts remain unchanged.
        required: true
        operation_id: aquarium-design-diagnosis-judge-applicability
        operation_digest: sha256:673d55d2530a272d112cd1febcc902e36efaf5c1317483c3009edc87037894c7
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
      - id: judge-summary
        type: text
        prompt: Record all original criterion rows and sources, current phase obligations and parent constraints, outcome gaps, remaining effect authority and proposed correction or evidence owner.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: judge-checkpoint-result
        type: check_result
        prompt: Record the caller-supplied result for aquarium-design-context-checkpoint; Podway does not execute or attest this check.
        help: Verify actual satisfaction of all current context phase obligations and applicable parent constraints from direct original evidence and exact candidate bytes, authorized checks and current authority. Preserve the complete original workflow rows, global verdict and remaining unmet/unverified counts; report completeness alone is insufficient.
        required: true
        operation_id: aquarium-design-context-checkpoint
        operation_digest: sha256:51645cc93188be0f2e40994bc0f90c19d6468976f81359e880eead21937527f8
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  decide-context-assessment:
    type: decision
    title: Evaluate context checkpoint
    objective: Is this exact current phase checkpoint ready for its original successor?
    prompt: Is this exact current phase checkpoint ready for its original successor?
    evidence_guidance:
      - Read the complete current original evidence, target, applicable Judge report and actual authority.
    options:
      - id: passed
        label: Checkpoint passed
        criteria: Current applicability and actual phase obligations are verified; original workflow outcome gaps remain preserved.
        guards:
          - evidence:
              node: judge-context
              item: judge-applicability
            field: outcome
            equals: pass
          - evidence:
              node: judge-context
              item: judge-checkpoint-result
            field: outcome
            equals: pass
      - id: inapplicable
        label: Report inapplicable
        criteria: Current original coverage or native bindings require reassessment.
        guards:
          - evidence:
              node: judge-context
              item: judge-applicability
            field: outcome
            not_equals: pass
      - id: rework
        label: Checkpoint correction required
        criteria: Actual checkpoint obligations failed; retain original outcome and require local correction authority.
        guards:
          - evidence:
              node: judge-context
              item: judge-applicability
            field: outcome
            equals: pass
          - evidence:
              node: judge-context
              item: judge-checkpoint-result
            field: outcome
            equals: fail
      - id: evidence-needed
        label: Checkpoint evidence incomplete
        criteria: Missing or inconclusive phase evidence requires separate local evidence authority.
        guards:
          - evidence:
              node: judge-context
              item: judge-applicability
            field: outcome
            equals: pass
          - evidence:
              node: judge-context
              item: judge-checkpoint-result
            field: outcome
            equals: inconclusive
    reason:
      required: true
      prompt: Record the current original evidence, target, attempt and authority basis.
  record-context-rework:
    type: action
    title: Record work correction basis
    intent: Bind the actual correction or evidence owner to remaining authority without creating another review or effect.
    instructions:
      - Read the actual triggering Judge report, original criteria and source attempt. Record exact correction or missing-evidence owner, current target and remaining actual effect authority. A negative verdict grants no effect or renewed provider budget.
      - Only the exact currently authorized rework operation may return to capture-context. An earlier different owner requires explicitly authorized manual rework. Preserve original Ouroboros leaf capabilities and all original approval gates.
    items:
      - id: semantic-followup-summary
        type: text
        prompt: Record source node/attempt/report, exact target, required work or evidence, original criterion IDs, finding lineage, consumed ordinals, remaining authority and exclusions.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: semantic-owner
        type: choice
        prompt: Record the earliest actual owner.
        required: true
        choices:
          - capture-context
      - id: semantic-authority
        type: check_result
        prompt: Record the caller-supplied result for aquarium-design-context-rework-authority; Podway does not execute or attest this check.
        help: Verify actual current unconsumed authority for the exact rework effect, original criterion and report, target, attempt and owner capture-context. Preserve actual document approval, clipboard authority, Ouroboros leaf scope, provider and check consumption; negative semantic evidence cannot create authority. Application evidence-only work permits verification of unchanged approved bytes, never a changed diff.
        required: true
        operation_id: aquarium-design-context-rework-authority
        operation_digest: sha256:85b0a6287dce176f8fc4ad1267e774dd0b05e58de673a964d6cedd55d868ee2b
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  confirm-context-rework-authority:
    type: decision
    title: Confirm semantic followup authority
    objective: Block uncovered corrections and evidence operations.
    prompt: Is the exact followup operation already authorized?
    evidence_guidance:
      - Read the complete current original evidence, target, applicable Judge report and actual authority.
    options:
      - id: authorized
        label: Followup authorized
        criteria: The exact current operation is covered by existing authority.
        guards:
          - evidence:
              node: record-context-rework
              item: semantic-authority
            field: outcome
            equals: pass
      - id: blocked
        label: Authority missing
        criteria: The effect is uncovered or uncertain; await actual bounded authority.
        guards:
          - evidence:
              node: record-context-rework
              item: semantic-authority
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Record the exact authority and consumption basis or blocker.
  record-context-evidence-needed:
    type: action
    title: Record work correction basis
    intent: Bind the actual correction or evidence owner to remaining authority without creating another review or effect.
    instructions:
      - Read the actual triggering Judge report, original criteria and source attempt. Record exact correction or missing-evidence owner, current target and remaining actual effect authority. A negative verdict grants no effect or renewed provider budget.
      - Only the exact currently authorized evidence-needed operation may return to capture-context. An earlier different owner requires explicitly authorized manual rework. Preserve original Ouroboros leaf capabilities and all original approval gates.
    items:
      - id: semantic-followup-summary
        type: text
        prompt: Record source node/attempt/report, exact target, required work or evidence, original criterion IDs, finding lineage, consumed ordinals, remaining authority and exclusions.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: semantic-owner
        type: choice
        prompt: Record the earliest actual owner.
        required: true
        choices:
          - capture-context
      - id: semantic-authority
        type: check_result
        prompt: Record the caller-supplied result for aquarium-design-context-evidence-needed-authority; Podway does not execute or attest this check.
        help: Verify actual current unconsumed authority for the exact evidence-needed effect, original criterion and report, target, attempt and owner capture-context. Preserve actual document approval, clipboard authority, Ouroboros leaf scope, provider and check consumption; negative semantic evidence cannot create authority. Application evidence-only work permits verification of unchanged approved bytes, never a changed diff.
        required: true
        operation_id: aquarium-design-context-evidence-needed-authority
        operation_digest: sha256:3a8f59e0b0153426217262d3403bd94c76ba033b295bb5d13836ab02ca4e6bca
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  confirm-context-evidence-needed-authority:
    type: decision
    title: Confirm semantic followup authority
    objective: Block uncovered corrections and evidence operations.
    prompt: Is the exact followup operation already authorized?
    evidence_guidance:
      - Read the complete current original evidence, target, applicable Judge report and actual authority.
    options:
      - id: authorized
        label: Followup authorized
        criteria: The exact current operation is covered by existing authority.
        guards:
          - evidence:
              node: record-context-evidence-needed
              item: semantic-authority
            field: outcome
            equals: pass
      - id: blocked
        label: Authority missing
        criteria: The effect is uncovered or uncertain; await actual bounded authority.
        guards:
          - evidence:
              node: record-context-evidence-needed
              item: semantic-authority
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Record the exact authority and consumption basis or blocker.
  judge-discovery-record:
    type: action
    title: Assess the current candidate
    intent: Obtain a retained report-only Judge assessment from all original evidence and current phase obligations.
    instructions:
      - Read every original workflow criterion, current phase obligation, applicable parent constraint and original artifact directly. Retain one logical report-only Judge and its complete history throughout this invocation; a Worker summary or inherited verdict never replaces evidence.
      - Preserve all actual original criterion rows, global outcome verdict and unmet/unverified counts. The separate checkpoint result assesses the actual current phase obligations; later workflow work may remain unmet without inventing a global pass. Report completeness alone cannot establish correction or application success.
      - Accept a complete applicable native report without reassessing or recursively judging the Judge. Record all final items, retain idle state, obtain current Podway receipt, then complete separately with fresh fences.
      - Missing original criteria, stale targets, unreadable evidence or unsupported native role/configuration/task/result bindings prevent applicability. A Judge report supplies no effects, clipboard, application, implementation, installation, staging, commit or publication authority.
    items:
      - id: judge-assessment
        type: artifact
        prompt: Reference the complete aquarium.judge-assessment/v1 report and its exact digest; Podway stores metadata only.
        required: true
        allowed_media_types:
          - application/json
      - id: judge-verdict
        type: choice
        prompt: Record the Judge verdict.
        required: true
        choices:
          - pass
          - rework
          - evidence-needed
      - id: judge-unmet-criteria
        type: integer
        prompt: Count mandatory unmet criteria, including omitted original criteria.
        required: true
        minimum: 0
      - id: judge-unverified-criteria
        type: integer
        prompt: Count mandatory unverified criteria, including incomplete compound criteria.
        required: true
        minimum: 0
      - id: judge-applicability
        type: check_result
        prompt: Record the caller-supplied result for aquarium-design-diagnosis-judge-applicability; Podway does not execute or attest this check.
        help: Verify every original criterion and current phase obligation, applicable parent constraints and direct original evidence; exact current target, requirement basis, goal revision, placement and attempt; Worker result, retained logical Judge identity and complete history; authentic acknowledged role/configuration/task/result bindings and current receipt. Original negative rows and actual verdict/counts remain unchanged.
        required: true
        operation_id: aquarium-design-diagnosis-judge-applicability
        operation_digest: sha256:673d55d2530a272d112cd1febcc902e36efaf5c1317483c3009edc87037894c7
        accepted_outcomes:
          - pass
