              node: apply-documents
              item: application-approval-result
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Record actual exact approval and target comparison or gap.
  record-application-approval-gap:
    type: action
    title: Record work correction basis
    intent: Bind the actual correction or evidence owner to remaining authority without creating another review or effect.
    instructions:
      - Read actual failed or stale application approval, exact current proposal and target snapshots. Preserve all original criteria and require remaining authority for original proposal preparation; no stale approval authorizes writes.
      - Only the exact currently authorized rework operation may return to draft. An earlier different owner requires explicitly authorized manual rework. Preserve original Ouroboros leaf capabilities and all original approval gates.
      - Correction or changed proposal/target invalidates prior application approval and returns through original drafting, quality and actual exact-diff approval. Evidence-only return permits verification of unchanged approved bytes or no-change only; discovering any changed proposal or target requires the original reapproval route before writes.
    items:
      - id: semantic-followup-summary
        type: text
        prompt: Record source node/attempt/report, exact target, required work or evidence, original criterion IDs, finding lineage, consumed ordinals, remaining authority and exclusions.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: semantic-owner
        type: choice
        prompt: Record the earliest actual owner.
        required: true
        choices:
          - draft
      - id: semantic-authority
        type: check_result
        prompt: Record the caller-supplied result for aquarium-design-application-rework-authority; Podway does not execute or attest this check.
        help: Verify actual current unconsumed authority for the exact rework effect, original criterion and report, target, attempt and owner draft. Preserve actual document approval, clipboard authority, Ouroboros leaf scope, provider and check consumption; negative semantic evidence cannot create authority. Application evidence-only work permits verification of unchanged approved bytes, never a changed diff.
        required: true
        operation_id: aquarium-design-application-rework-authority
        operation_digest: sha256:da4e75109e40ef704151d19aac7e51b73fc0cbac0deed9b39451aa33199ec798
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  confirm-application-approval-gap-authority:
    type: decision
    title: Confirm semantic followup authority
    objective: Block uncovered corrections and evidence operations.
    prompt: Is the exact followup operation already authorized?
    evidence_guidance:
      - Read the complete current original evidence, target, applicable Evaluator report and actual authority.
    options:
      - id: authorized
        label: Followup authorized
        criteria: The exact current operation is covered by existing authority.
        guards:
          - evidence:
              node: record-application-approval-gap
              item: semantic-authority
            field: outcome
            equals: pass
      - id: blocked
        label: Authority missing
        criteria: The effect is uncovered or uncertain; await actual bounded authority.
        guards:
          - evidence:
              node: record-application-approval-gap
              item: semantic-authority
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Record the exact authority and consumption basis or blocker.
