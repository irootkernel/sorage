schema: podway.procedure/v2
id: aquarium-war-room-v2
version: "8"
name: Aquarium War Room
purpose: Diagnose one difficult bug and produce an approved task, epic, incomplete-investigation record, or no-work outcome without implementing a fix.
description: A Podway record of incident baseline or reproduction, investigation, semantic cause and scope decisions, guarded proposal quality, exact-diff approval, documentation, and closeout.
goal_tracking: true
node_definitions:
  baseline-record:
    type: action
    title: Capture incident baseline
    intent: Bind the investigation to symptoms, authority, safe scope, and the approved provider boundary.
    instructions:
      - Use war-room to capture the exact symptoms, expected behavior, safe reproduction authority, and evidence limits.
      - Do not implement a fix, change shared services, or publish. Approved diagnostic documents use the shared separately authorized task-commit boundary.
      - Deliver the complete original artifacts, exact target, requirements, checks and effect boundaries in aquarium.worker-handoff/v1. Accept its authentic current native result and receipt before separate Action completion; Worker delivery is not Judge passage or Primary acceptance.
    items:
      - id: reproduction-state
        type: choice
        prompt: Record whether the defect was reproduced safely in the approved boundary.
        required: true
        choices:
          - reproduced
          - not-reproduced
          - reproduction-not-required
      - id: observed-behavior
        type: text
        prompt: Record the observed behavior, including the bounded reproduction result or the evidence available when reproduction was not safe or required.
        required: true
        min_length: 1
        max_length: 3000
        multiline: true
      - id: expected-behavior
        type: text
        prompt: Record the authority-backed expected behavior and the exact divergence under investigation.
        required: true
        min_length: 1
        max_length: 3000
        multiline: true
      - id: baseline-summary
        type: text
        prompt: Record canonical identity, symptoms, revisions, sources and digests, safe reproduction boundary, exclusions, and gaps.
        required: true
        min_length: 1
        max_length: 5000
        multiline: true
      - id: worker-handoff
        type: artifact
        prompt: Reference the complete aquarium.worker-handoff/v1 candidate, exact target, requirement basis, checks, authority, gaps and authentic native result bindings.
        required: true
        allowed_media_types:
          - application/json
  investigation-record:
    type: action
    title: Reproduce and investigate
    intent: Record isolated reproduction, hypotheses, tests, and observations without source mutation.
    instructions:
      - Investigate competing hypotheses with authorized read-only or isolated checks and preserve uncertainty.
      - Do not modify the product or treat correlation as an established cause.
      - Deliver the complete original artifacts, exact target, requirements, checks and effect boundaries in aquarium.worker-handoff/v1. Accept its authentic current native result and receipt before separate Action completion; Worker delivery is not Judge passage or Primary acceptance.
    items:
      - id: investigation-summary
        type: text
        prompt: Record fixture paths, commands, observations, hypothesis outcomes, provider operation IDs, and repository status.
        required: true
        min_length: 1
        max_length: 8000
        multiline: true
      - id: worker-handoff
        type: artifact
        prompt: Reference the complete aquarium.worker-handoff/v1 candidate, exact target, requirement basis, checks, authority, gaps and authentic native result bindings.
        required: true
        allowed_media_types:
          - application/json
  cause-decision:
    type: decision
    title: Evaluate root cause
    objective: Distinguish an evidence-backed cause, verified expected behavior requiring no work, and an investigation needing another bounded pass.
    prompt: Is the root cause sufficiently established to shape work?
    evidence_guidance:
      - Read reproductions, competing hypotheses, authority, and counter-evidence.
    options:
      - id: established
        label: Root cause established
        criteria: Current evidence identifies a causal mechanism and affected boundary.
        guards:
          - evidence:
              node: judge-investigation
              item: judge-cause-outcome
            equals: established
      - id: no-work
        label: No corrective work needed
        criteria: Current evidence proves expected behavior holds and no corrective work unit is needed; unexplained or unreproduced symptoms remain incomplete.
        guards:
          - evidence:
              node: judge-investigation
              item: judge-cause-outcome
            equals: no-work
      - id: investigate-more
        label: More investigation required
        criteria: A safe bounded investigation can materially reduce remaining uncertainty.
        guards:
          - evidence:
              node: judge-investigation
              item: judge-cause-outcome
            equals: investigate-more
      - id: blocked
        label: Investigation blocked
        criteria: Required evidence cannot be obtained within the approved safe scope.
        guards:
          - evidence:
              node: judge-investigation
              item: judge-cause-outcome
            equals: blocked
    reason:
      required: true
      prompt: Explain the decision from current evidence.
  scope-decision:
    type: decision
    title: Classify the work unit
    objective: End diagnosis with exactly one bounded task, one epic, or an incomplete investigation.
    prompt: What artifact should this investigation produce?
    evidence_guidance:
      - Read the established cause or blocker, affected contracts, dependencies, and risks.
    options:
      - id: task
        label: Bounded task
        criteria: One coherent work unit can correct and verify the cause.
        guards:
          - evidence:
              node: judge-investigation
              item: judge-scope-outcome
            equals: task
      - id: epic
        label: Multi-work-unit epic
        criteria: Correctness requires ordered work across multiple owners or seams.
        guards:
          - evidence:
              node: judge-investigation
              item: judge-scope-outcome
            equals: epic
      - id: incomplete
        label: Investigation incomplete
        criteria: Root cause or safe verification remains insufficient for implementation authority.
        guards:
          - evidence:
              node: judge-investigation
              item: judge-scope-outcome
            equals: incomplete
    reason:
      required: true
      prompt: Explain the classification and ownership boundary.
  proposal-record:
    type: action
    title: Record the work-unit proposal
    intent: Bind approval to one exact task, epic, incomplete-investigation draft, or no-work outcome.
    instructions:
      - Draft only the selected work-unit, incomplete-investigation document, or no-work outcome with exact scope and evidence limits.
      - Put durable diagnostic notes in the canonical specification, ADR, or operations owner; propose a missing owner before creating it. Keep raw output and runtime identities private.
      - A no-work proposal states why expected behavior holds and its next action. When no durable document is owed, propose explicit no-change without inventing a Task, dossier, or investigation-log file.
      - The proposal is not fix implementation or approval to change source.
      - Deliver the complete original artifacts, exact target, requirements, checks and effect boundaries in aquarium.worker-handoff/v1. Accept its authentic current native result and receipt before separate Action completion; Worker delivery is not Judge passage or Primary acceptance.
    items:
      - id: proposal-summary
        type: text
        prompt: Record target paths, draft digests, scope, evidence, acceptance checks, and risks.
        required: true
        min_length: 1
        max_length: 6000
        multiline: true
      - id: worker-handoff
        type: artifact
        prompt: Reference the complete aquarium.worker-handoff/v1 candidate, exact target, requirement basis, checks, authority, gaps and authentic native result bindings.
        required: true
        allowed_media_types:
          - application/json
  quality-record:
    type: action
    title: Record diagnostic quality review
    intent: Record the Ouroboros quality pass and local adjudication for the selected diagnostic draft.
    instructions:
      - Run the approved quality capability on the exact diagnostic draft and adjudicate findings locally.
      - Quality evidence does not authorize applying documents or implementing the fix.
      - Preserve the raw QA PASS, REVISE, or FAIL verdict and exact draft identity in quality-summary. A completed locally adjudicable operation records pass; record every unresolved valid issue in its owner count and list.
      - Route content findings to their owner before another QA pass. Artifact FAIL is not operation failure. Failed, missing, or non-adjudicable operation evidence records fail or inconclusive; retry unchanged input only through supported authorized recovery.
      - Deliver the complete original artifacts, exact target, requirements, checks and effect boundaries in aquarium.worker-handoff/v1. Accept its authentic current native result and receipt before separate Action completion; Worker delivery is not Judge passage or Primary acceptance.
    items:
      - id: quality-result
        type: check_result
        prompt: Record the caller-supplied result for aquarium-diagnostic-quality; Podway does not execute or attest the operation.
        help: The declared operation is "Review the current Aquarium diagnostic proposal, investigation evidence, classification, and trust claims outside Podway in the recorded input basis." The matching digest identifies only this abstract slot contract and does not prove that any operation ran.
        required: true
        operation_id: aquarium-diagnostic-quality
        operation_digest: sha256:c0ffd5f99c1298e6e184c69ab32ef83baa5db605e30ed201598f63770bc7cbbd
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
      - id: quality-summary
        type: text
        prompt: Record the reviewed draft identity and digest, Ouroboros QA operation, locally verified findings, adjudication, and repository status.
        required: true
        min_length: 1
        max_length: 6000
        multiline: true
      - id: unresolved-investigation-findings
        type: integer
        prompt: Record the number of unresolved baseline, reproduction, or investigation findings.
        required: true
        minimum: 0
      - id: unresolved-proposal-findings
        type: integer
        prompt: Record the number of unresolved classification, proposal, or trust-claim findings.
        required: true
        minimum: 0
      - id: investigation-findings
        type: list
        prompt: Record bounded unresolved baseline, reproduction, or investigation findings.
        required: false
        required_when:
          - item: unresolved-investigation-findings
            at_least: 1
        min_items: 1
        max_items: 20
        max_item_length: 1000
        max_total_length: 20000
        unique: true
      - id: proposal-findings
        type: list
        prompt: Record bounded unresolved classification, proposal, or trust-claim findings.
        required: false
        required_when:
          - item: unresolved-proposal-findings
            at_least: 1
        min_items: 1
        max_items: 20
        max_item_length: 1000
        max_total_length: 20000
        unique: true
      - id: quality-observations
        type: list
        prompt: Record failure or inconclusive quality-operation observations.
        required: false
        required_when:
          - item: quality-result
            field: outcome
            not_equals: pass
        min_items: 1
        max_items: 20
        max_item_length: 1000
        max_total_length: 20000
        unique: true
      - id: worker-handoff
        type: artifact
        prompt: Reference the complete aquarium.worker-handoff/v1 candidate, exact target, requirement basis, checks, authority, gaps and authentic native result bindings.
        required: true
        allowed_media_types:
          - application/json
  quality-decision:
    type: decision
    title: Evaluate diagnostic quality
    objective: Route the quality result to the phase that owns each correction before approval.
    prompt: Is the selected diagnostic draft ready for exact-diff approval?
    evidence_guidance:
      - Read the selected draft, Ouroboros QA result, local adjudication, and unresolved-valid-findings count.
    options:
      - id: passed
        label: Quality passed
        criteria: The quality operation completed with adjudicable output and no unresolved investigation or proposal finding remains.
        guards:
          - evidence:
              node: quality
              item: quality-result
            field: outcome
            equals: pass
          - evidence:
              node: quality
              item: unresolved-investigation-findings
            equals: 0
          - evidence:
              node: quality
              item: unresolved-proposal-findings
            equals: 0
      - id: investigation-changes
        label: Investigation changes required
        criteria: At least one baseline, reproduction, or investigation finding remains.
        guards:
          - evidence:
              node: quality
              item: quality-result
            field: outcome
            equals: pass
          - evidence:
              node: quality
              item: unresolved-investigation-findings
            at_least: 1
      - id: proposal-changes
        label: Proposal changes required
        criteria: No investigation finding remains and at least one classification, proposal, or trust-claim finding remains.
        guards:
          - evidence:
              node: quality
              item: quality-result
            field: outcome
            equals: pass
          - evidence:
              node: quality
              item: unresolved-investigation-findings
            equals: 0
          - evidence:
              node: quality
              item: unresolved-proposal-findings
            at_least: 1
      - id: incomplete
        label: Quality review incomplete
        criteria: The quality operation failed, returned no adjudicable output, or is inconclusive.
        guards:
          - evidence:
              node: quality
              item: quality-result
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Explain the quality decision from the current draft and adjudicated findings.
  approval-decision:
    type: decision
    title: Record exact-diff approval
    objective: Apply only the complete diagnostic document diff explicitly approved by the user.
    prompt: Did the user approve the displayed target paths and complete diff?
    evidence_guidance:
      - Compare the displayed proposal with current target snapshots.
    options:
      - id: approved
        label: Exact diff approved
        criteria: The complete diff or explicit no-change outcome was approved and target snapshots are unchanged.
      - id: changes-requested
        label: Changes requested
        criteria: The proposal was rejected, changed, or became stale.
    reason:
      required: true
      prompt: Record the user's decision and exact approved boundary.
  documentation-record:
    type: action
    title: Apply diagnostic documents
    intent: Record the approved canonical-document changes or no-change outcome and validation.
    instructions:
      - Apply only the exact approved diagnostic document diff and run current document validation, or verify and record the approved no-change outcome when no durable document is owed.
      - Do not implement the fix, mutate shared services, or publish. Document approval alone does not authorize staging or commit; use the shared separate task-commit boundary.
      - Deliver the complete original artifacts, exact target, requirements, checks and effect boundaries in aquarium.worker-handoff/v1. Accept its authentic current native result and receipt before separate Action completion; Worker delivery is not Judge passage or Primary acceptance.
      - Primary supplies the actual exact-diff approval and current snapshot basis. Recheck before any write. A changed proposal or target returns through original draft/investigation, challenge where applicable, quality and actual approval. Evidence-only re-entry verifies unchanged approved bytes without application authority for a changed diff.
    items:
      - id: documentation-summary
        type: text
        prompt: Record applied paths and digests, validation, and work-unit classification.
        required: true
        min_length: 1
        max_length: 5000
        multiline: true
      - id: worker-handoff
        type: artifact
        prompt: Reference the complete aquarium.worker-handoff/v1 candidate, exact target, requirement basis, checks, authority, gaps and authentic native result bindings.
        required: true
        allowed_media_types:
          - application/json
      - id: application-approval-result
        type: check_result
        prompt: Record the caller-supplied result for aquarium-war-room-application-approval; Podway does not execute or attest this check.
        help: Verify actual user approval of the complete exact current proposal or no-change, unchanged approved target snapshots before writes, applied bytes matching that approval and required validation. Changed proposals or targets require original quality and actual exact-diff approval again. Neither a Worker nor Judge verdict grants this authority.
        required: true
        operation_id: aquarium-war-room-application-approval
        operation_digest: sha256:395e4186c41d5296fec5ad178af052f6f897f41b0cb9a5e242da4b6c651da546
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  goal-assessment:
    type: decision
    title: Assess the diagnostic goal
    objective: Determine whether diagnosis produced its approved non-implementation artifact.
    prompt: What is the outcome of the war-room goal?
    evidence_guidance:
      - Read investigation evidence, approved documents, validation, and remaining gaps.
      - Use the current applicable final Judge report and fresh original native criterion statuses; every mandatory original criterion and integration obligation must pass.
      - Faithful negative checkpoints, zero provider findings and unsupported manual claims cannot establish whole-goal success.
    options:
      - id: achieved
        label: Goal achieved
        criteria: An approved task, epic, incomplete-investigation record, or no-work outcome is applied and validated, including verified no-change when no document is owed.
        guards:
          - evidence:
              node: judge-diagnosis
              item: judge-goal-outcome
            equals: achieved
          - evidence:
              node: judge-diagnosis
              item: judge-verdict
            equals: pass
          - evidence:
              node: judge-diagnosis
              item: judge-unmet-criteria
            equals: 0
          - evidence:
              node: judge-diagnosis
              item: judge-unverified-criteria
            equals: 0
      - id: not-achieved
        label: Goal not achieved
        criteria: The required evidence or approved artifact remains incomplete.
        guards:
          - evidence:
              node: judge-diagnosis
              item: judge-goal-outcome
            equals: not-achieved
      - id: superseded
        label: Goal superseded
        criteria: The diagnostic outcome is no longer desired.
        guards:
          - evidence:
              node: judge-diagnosis
              item: judge-goal-outcome
            equals: superseded
    reason:
      required: true
      prompt: Explain the outcome using current evidence.
    assessment:
      target: session_goal
      outcomes:
        achieved: achieved
        not-achieved: not_achieved
        superseded: superseded
  closeout-record:
    type: action
    title: Record war-room closeout
    intent: Record final classification, evidence, artifacts, residue, and publication state without a fix.
    instructions:
      - Record the approved diagnostic artifact or no-work outcome, any unresolved cause, and the next action or explicit absence of follow-up.
      - Never claim that a task or epic proposal solved the defect; commit and publication remain separate.
    items:
      - id: closeout-summary
        type: text
        prompt: Record classification, paths and digests or verified no-change, evidence gaps, repository residue, and next action, including no follow-up.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
  judge-baseline-record:
    type: action
    title: Assess the current candidate
    intent: Obtain a retained report-only Judge assessment from all original evidence and current phase obligations.
    instructions:
      - Read every original workflow criterion, current phase obligation, applicable parent constraint and original artifact directly. Retain one logical report-only Judge and its complete history throughout this invocation; a Worker summary or inherited verdict never replaces evidence.
      - Preserve all actual original criterion rows, global outcome verdict and unmet/unverified counts. The separate checkpoint result assesses the actual current phase obligations; later workflow work may remain unmet without inventing a global pass. Report completeness alone cannot establish correction or application success.
      - Accept a complete applicable native report without reassessing or recursively judging the Judge. Record all final items, retain idle state, obtain current Podway receipt, then complete separately with fresh fences.
      - Missing original criteria, stale targets, unreadable evidence or unsupported native role/configuration/task/result bindings prevent applicability. A Judge report supplies no effects, clipboard, application, implementation, installation, staging, commit or publication authority.
    items:
      - id: judge-assessment
        type: artifact
        prompt: Reference the complete aquarium.judge-assessment/v1 report and its exact digest; Podway stores metadata only.
        required: true
        allowed_media_types:
          - application/json
      - id: judge-verdict
        type: choice
        prompt: Record the Judge verdict.
        required: true
        choices:
          - pass
          - rework
          - evidence-needed
      - id: judge-unmet-criteria
        type: integer
        prompt: Count mandatory unmet criteria, including omitted original criteria.
        required: true
        minimum: 0
      - id: judge-unverified-criteria
        type: integer
        prompt: Count mandatory unverified criteria, including incomplete compound criteria.
        required: true
        minimum: 0
      - id: judge-applicability
        type: check_result
        prompt: Record the caller-supplied result for aquarium-design-diagnosis-judge-applicability; Podway does not execute or attest this check.
        help: Verify every original criterion and current phase obligation, applicable parent constraints and direct original evidence; exact current target, requirement basis, goal revision, placement and attempt; Worker result, retained logical Judge identity and complete history; authentic acknowledged role/configuration/task/result bindings and current receipt. Original negative rows and actual verdict/counts remain unchanged.
        required: true
        operation_id: aquarium-design-diagnosis-judge-applicability
        operation_digest: sha256:673d55d2530a272d112cd1febcc902e36efaf5c1317483c3009edc87037894c7
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
      - id: judge-summary
        type: text
        prompt: Record all original criterion rows and sources, current phase obligations and parent constraints, outcome gaps, remaining effect authority and proposed correction or evidence owner.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: judge-checkpoint-result
        type: check_result
        prompt: Record the caller-supplied result for aquarium-war-room-baseline-checkpoint; Podway does not execute or attest this check.
        help: Verify actual satisfaction of all current baseline phase obligations and applicable parent constraints from direct original evidence and exact candidate bytes, authorized checks and current authority. Preserve the complete original workflow rows, global verdict and remaining unmet/unverified counts; report completeness alone is insufficient.
        required: true
        operation_id: aquarium-war-room-baseline-checkpoint
        operation_digest: sha256:74b2e644654ef38d1dc8f8722189e85b140094b93a3dbb4c7c72dd09903211a9
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  decide-baseline-assessment:
    type: decision
    title: Evaluate baseline checkpoint
    objective: Is this exact current phase checkpoint ready for its original successor?
    prompt: Is this exact current phase checkpoint ready for its original successor?
    evidence_guidance:
      - Read the complete current original evidence, target, applicable Judge report and actual authority.
    options:
      - id: passed
        label: Checkpoint passed
        criteria: Current applicability and actual phase obligations are verified; original workflow outcome gaps remain preserved.
        guards:
          - evidence:
              node: judge-baseline
              item: judge-applicability
            field: outcome
            equals: pass
          - evidence:
              node: judge-baseline
              item: judge-checkpoint-result
            field: outcome
            equals: pass
      - id: inapplicable
        label: Report inapplicable
        criteria: Current original coverage or native bindings require reassessment.
        guards:
          - evidence:
              node: judge-baseline
              item: judge-applicability
            field: outcome
            not_equals: pass
      - id: rework
        label: Checkpoint correction required
        criteria: Actual checkpoint obligations failed; retain original outcome and require local correction authority.
        guards:
          - evidence:
              node: judge-baseline
              item: judge-applicability
            field: outcome
            equals: pass
          - evidence:
              node: judge-baseline
              item: judge-checkpoint-result
            field: outcome
            equals: fail
      - id: evidence-needed
        label: Checkpoint evidence incomplete
        criteria: Missing or inconclusive phase evidence requires separate local evidence authority.
        guards:
          - evidence:
              node: judge-baseline
              item: judge-applicability
            field: outcome
            equals: pass
          - evidence:
              node: judge-baseline
              item: judge-checkpoint-result
            field: outcome
            equals: inconclusive
    reason:
      required: true
      prompt: Record the current original evidence, target, attempt and authority basis.
  record-baseline-rework:
    type: action
    title: Record work correction basis
    intent: Bind the actual correction or evidence owner to remaining authority without creating another review or effect.
    instructions:
      - Read the actual triggering Judge report, original criteria and source attempt. Record exact correction or missing-evidence owner, current target and remaining actual effect authority. A negative verdict grants no effect or renewed provider budget.
      - Only the exact currently authorized rework operation may return to capture-baseline. An earlier different owner requires explicitly authorized manual rework. Preserve original Ouroboros leaf capabilities and all original approval gates.
    items:
      - id: semantic-followup-summary
        type: text
        prompt: Record source node/attempt/report, exact target, required work or evidence, original criterion IDs, finding lineage, consumed ordinals, remaining authority and exclusions.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: semantic-owner
        type: choice
        prompt: Record the earliest actual owner.
        required: true
        choices:
          - capture-baseline
      - id: semantic-authority
        type: check_result
        prompt: Record the caller-supplied result for aquarium-war-room-baseline-rework-authority; Podway does not execute or attest this check.
        help: Verify actual current unconsumed authority for the exact rework effect, original criterion and report, target, attempt and owner capture-baseline. Preserve actual document approval, clipboard authority, Ouroboros leaf scope, provider and check consumption; negative semantic evidence cannot create authority. Application evidence-only work permits verification of unchanged approved bytes, never a changed diff.
        required: true
        operation_id: aquarium-war-room-baseline-rework-authority
        operation_digest: sha256:7c6048754ad69b799a1c35959d671f1c6adc9d9e74189261d03581335a0af6d9
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  confirm-baseline-rework-authority:
    type: decision
    title: Confirm semantic followup authority
    objective: Block uncovered corrections and evidence operations.
    prompt: Is the exact followup operation already authorized?
    evidence_guidance:
      - Read the complete current original evidence, target, applicable Judge report and actual authority.
    options:
      - id: authorized
        label: Followup authorized
        criteria: The exact current operation is covered by existing authority.
        guards:
          - evidence:
              node: record-baseline-rework
              item: semantic-authority
            field: outcome
            equals: pass
      - id: blocked
        label: Authority missing
        criteria: The effect is uncovered or uncertain; await actual bounded authority.
        guards:
          - evidence:
              node: record-baseline-rework
              item: semantic-authority
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Record the exact authority and consumption basis or blocker.
  record-baseline-evidence-needed:
    type: action
    title: Record work correction basis
    intent: Bind the actual correction or evidence owner to remaining authority without creating another review or effect.
    instructions:
      - Read the actual triggering Judge report, original criteria and source attempt. Record exact correction or missing-evidence owner, current target and remaining actual effect authority. A negative verdict grants no effect or renewed provider budget.
      - Only the exact currently authorized evidence-needed operation may return to capture-baseline. An earlier different owner requires explicitly authorized manual rework. Preserve original Ouroboros leaf capabilities and all original approval gates.
    items:
      - id: semantic-followup-summary
        type: text
        prompt: Record source node/attempt/report, exact target, required work or evidence, original criterion IDs, finding lineage, consumed ordinals, remaining authority and exclusions.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: semantic-owner
        type: choice
        prompt: Record the earliest actual owner.
        required: true
        choices:
          - capture-baseline
      - id: semantic-authority
        type: check_result
        prompt: Record the caller-supplied result for aquarium-war-room-baseline-evidence-needed-authority; Podway does not execute or attest this check.
        help: Verify actual current unconsumed authority for the exact evidence-needed effect, original criterion and report, target, attempt and owner capture-baseline. Preserve actual document approval, clipboard authority, Ouroboros leaf scope, provider and check consumption; negative semantic evidence cannot create authority. Application evidence-only work permits verification of unchanged approved bytes, never a changed diff.
        required: true
        operation_id: aquarium-war-room-baseline-evidence-needed-authority
        operation_digest: sha256:b86879d618cdb3777b49213dea681c242492316b6d326610bcf05f18415f12d1
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  confirm-baseline-evidence-needed-authority:
    type: decision
    title: Confirm semantic followup authority
    objective: Block uncovered corrections and evidence operations.
    prompt: Is the exact followup operation already authorized?
    evidence_guidance:
      - Read the complete current original evidence, target, applicable Judge report and actual authority.
    options:
      - id: authorized
        label: Followup authorized
        criteria: The exact current operation is covered by existing authority.
        guards:
          - evidence:
              node: record-baseline-evidence-needed
