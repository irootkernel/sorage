graph:
  entry: capture-baseline
  nodes:
    - id: capture-baseline
      use: baseline-record
      delegation:
        binding_ref: aquarium-native
        role_ref: aquarium-worker/v1
        role_snapshot_digest: sha256:7544cae7f4becb8fcf0d119e8ac0aa9815bd29d7c96cfa1761b2e00acd69e53e
        max_rounds: 32
        after_accept: retain
      next: judge-baseline
    - id: investigate
      use: investigation-record
      evidence_from:
        - node: capture-baseline
          required: true
          items:
            - reproduction-state
            - observed-behavior
            - expected-behavior
            - baseline-summary
      delegation:
        binding_ref: aquarium-native
        role_ref: aquarium-worker/v1
        role_snapshot_digest: sha256:7544cae7f4becb8fcf0d119e8ac0aa9815bd29d7c96cfa1761b2e00acd69e53e
        max_rounds: 32
        after_accept: retain
      next: judge-investigation
    - id: decide-cause
      use: cause-decision
      evidence_from:
        - node: investigate
          required: true
          items:
            - investigation-summary
        - node: judge-investigation
          required: true
          items:
            - judge-cause-outcome
      routes:
        established:
          to: classify-scope
          effect: advance
        no-work:
          to: draft-no-work
          effect: advance
        investigate-more:
          to: investigate
          effect: rework
        blocked:
          to: draft-incomplete
          effect: advance
    - id: classify-scope
      use: scope-decision
      evidence_from:
        - node: investigate
          required: true
          items:
            - investigation-summary
        - node: decide-cause
          required: true
        - node: judge-investigation
          required: true
          items:
            - judge-scope-outcome
      routes:
        task:
          to: draft-task
          effect: advance
        epic:
          to: draft-epic
          effect: advance
        incomplete:
          to: draft-incomplete
          effect: advance
    - id: draft-task
      use: proposal-record
      delegation:
        binding_ref: aquarium-native
        role_ref: aquarium-worker/v1
        role_snapshot_digest: sha256:7544cae7f4becb8fcf0d119e8ac0aa9815bd29d7c96cfa1761b2e00acd69e53e
        max_rounds: 32
        after_accept: retain
      next: judge-proposal
    - id: draft-epic
