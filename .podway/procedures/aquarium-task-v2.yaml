schema: podway.procedure/v2
id: aquarium-task-v2
version: "34"
name: Aquarium Task
purpose: Deliver one approved roadmap task through the complete Aquarium evidence workflow.
description: A Podway record of task-handler planning, implementation, refinement, verification, documentation, review, approval, and closeout.
goal_tracking: true
node_definitions:
  plan-record:
    type: action
    title: Record the approved plan
    intent: Bind execution to the approved task plan and authority.
    instructions:
      - Use task-handler after task-plan approval; record the exact task, plan, checks, and granted effects.
      - Do not implement, stage, review, commit, or publish while recording the plan.
      - For plan-handoff, attach the optional plan-handoff-artifact while record-plan is current, verify its recorded digest and byte size, and only then complete this action.
      - Deliver the complete aquarium.executor-handoff/v3 with original evidence, actual candidate, checks, authority and gaps. Record actual returned work and available public handles; unavailable telemetry remains unknown. Complete this ordinary Action with current fences; delivery is not Evaluator passage.
      - Use the review strategy contract to recommend a route from the original goal, scope, difficulty, impact and uncertainty; preserve an explicit choice and record selection and UI relevance in the existing approved plan or envelope.
    items:
      - id: plan-summary
        type: text
        prompt: Record the approved plan and its authority boundary.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: review-route
        type: choice
        prompt: Record the selected completion-review route for this Task envelope.
        required: true
        choices:
          - mulgae
          - herdr
          - subagent-review
          - waived
      - id: review-target-scope
        type: text
        prompt: Record the Task identity, objective and authorities, base revision, exact staged index tree and path inventory or resolved Git candidate, ordered work commits when present, included paths and artifacts, and excluded state.
        required: true
        min_length: 1
        max_length: 1000
        multiline: true
      - id: review-selection-summary
        type: text
        prompt: Record the route selection authority, explicit Herdr main reviewer and team or expected Subagent base and UI reviewers when applicable, and waiver authority and assurance limit when waived.
        required: true
        min_length: 1
        max_length: 2000
        multiline: true
      - id: plan-handoff-artifact
        type: artifact
        prompt: Attach the approved Markdown plan only for an explicit plan handoff.
        required: false
        allowed_media_types:
          - text/markdown
      - id: executor-handoff
        type: artifact
        prompt: Reference the complete aquarium.executor-handoff/v3 candidate, exact target, requirement basis, checks, authority, gaps and actual results and available public native handles.
        required: true
        allowed_media_types:
          - application/json
  implementation-entry-record:
    type: action
    title: Prepare implementation entry
    intent: Bind implementation either to the approved plan or to an admitted failed backend-check or semantic review decision.
    instructions:
      - Reconstruct the approved plan and exact first-entry or rework cause before delegating implementation.
      - Do not manufacture fresh authority or evidence from an older attempt.
      - Before rework, put the exact source attempt and record identity, target, finding or failed-check IDs, admitted correction authority, and phase obligations in the decision reason. On entry, match the native rework history target_attempt_id to the current attempt and record that bounded cause as new evidence; stale source records are historical provenance, not fresh evidence.
      - When a plan handoff artifact is present, read its selected metadata and verify the complete local file digest and byte size before preparing or resuming implementation. A missing or changed file stops work; an ordinary session without an artifact remains valid.
    items:
      - id: implementation-entry-summary
        type: text
        prompt: Record the approved-plan basis on first entry or the exact admitted review evidence and rework basis on re-entry.
        required: true
        min_length: 1
        max_length: 3000
        multiline: true
  implementation-record:
    type: action
    title: Record implementation
    intent: Record the isolated implementation and focused evidence.
    instructions:
      - Use task-implement with the selected plan and implementation-entry basis.
      - Do not stage, edit lifecycle state, invoke review, commit, or publish; return the exact task-owned delta and focused evidence.
      - Deliver the complete aquarium.executor-handoff/v3 with original evidence, actual candidate, checks, authority and gaps. Record actual returned work and available public handles; unavailable telemetry remains unknown. Complete this ordinary Action with current fences; delivery is not Evaluator passage.
    items:
      - id: implementation-summary
        type: text
        prompt: Summarize the implemented requirements and task-owned paths.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: source-revision
        type: text
        prompt: Record HEAD and the task-owned dirty-tree identity.
        required: true
        min_length: 1
        max_length: 512
        multiline: true
      - id: executor-handoff
        type: artifact
        prompt: Reference the complete aquarium.executor-handoff/v3 candidate, exact target, requirement basis, checks, authority, gaps and actual results and available public native handles.
        required: true
        allowed_media_types:
          - application/json
  verification-record:
    type: action
    title: Record verification
    intent: Record current requirement-mapped verification evidence.
    instructions:
      - Use task-verify on the current refined target and map every applicable requirement to current evidence.
      - Do not review or commit; report failed, stale, unavailable, and inconclusive evidence explicitly.
      - Deliver the complete aquarium.executor-handoff/v3 with original evidence, actual candidate, checks, authority and gaps. Record actual returned work and available public handles; unavailable telemetry remains unknown. Complete this ordinary Action with current fences; delivery is not Evaluator passage.
    items:
      - id: verification-result
        type: check_result
        prompt: Record the caller-supplied result for software-change-verification; Podway does not execute or attest the operation.
        help: The declared operation is "Run the repository-authoritative verification required for the current software change in the recorded input basis." The matching digest identifies only this abstract slot contract and does not prove that any operation ran.
        required: true
        operation_id: software-change-verification
        operation_digest: sha256:b904aefd4dbd6b01337645fd34b1424efc9faf3d22c936de666305335076969e
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
      - id: verification-observations
        type: list
        prompt: Record failure or inconclusive observations, commands, actors, exit statuses, evidence references, and gaps.
        required: false
        required_when:
          - item: verification-result
            field: outcome
            not_equals: pass
        min_items: 1
        max_items: 20
        max_item_length: 1000
        max_total_length: 20000
        unique: true
      - id: executor-handoff
        type: artifact
        prompt: Reference the complete aquarium.executor-handoff/v3 candidate, exact target, requirement basis, checks, authority, gaps and actual results and available public native handles.
        required: true
        allowed_media_types:
          - application/json
  refinement-record:
    type: action
    title: Record refinement
    intent: Record deslop, optimization, staged baseline, and refreshed checks.
    instructions:
      - Use task-refine only for authorized cleanup and optimization of the current implementation.
      - Return the exact refined target and refreshed evidence without review, lifecycle closeout, commit, or publication.
      - Deliver the complete aquarium.executor-handoff/v3 with original evidence, actual candidate, checks, authority and gaps. Record actual returned work and available public handles; unavailable telemetry remains unknown. Complete this ordinary Action with current fences; delivery is not Evaluator passage.
    items:
      - id: refinement-summary
        type: text
        prompt: Record cleanup, optimization reasoning, staging scope, and refreshed evidence.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: executor-handoff
        type: artifact
        prompt: Reference the complete aquarium.executor-handoff/v3 candidate, exact target, requirement basis, checks, authority, gaps and actual results and available public native handles.
        required: true
        allowed_media_types:
          - application/json
  documentation-record:
    type: action
    title: Record documentation
    intent: Record durable documentation and roadmap review-state evidence.
    instructions:
      - Use task-document with the selected current implementation and verification evidence.
      - Document current behavior in its canonical owner; do not copy runtime logs or perform review, commit, or publication.
      - Deliver the complete aquarium.executor-handoff/v3 with original evidence, actual candidate, checks, authority and gaps. Record actual returned work and available public handles; unavailable telemetry remains unknown. Complete this ordinary Action with current fences; delivery is not Evaluator passage.
    items:
      - id: documentation-summary
        type: text
        prompt: Record documentation paths, synchronization, validation, and roadmap state.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: executor-handoff
        type: artifact
        prompt: Reference the complete aquarium.executor-handoff/v3 candidate, exact target, requirement basis, checks, authority, gaps and actual results and available public native handles.
        required: true
        allowed_media_types:
          - application/json
  review-checkpoint-record:
    type: action
    title: Prepare the review checkpoint
    intent: Bind the next review operation to the approved route, a completed-checkpoint continuation, or one explicit route change while preserving lineage.
    instructions:
      - Use the approved plan route for the first checkpoint, continue the same completed route only through its bounded correction authority, or use one explicitly authorized route change or delegated-review waiver.
      - For any route change after a started operation, carry its authoritative evidence reference, prior completed ordinal, findings, remaining authority, and corrected-target obligation.
      - This action records authority and lineage only; it does not launch a reviewer, waive review, or consume an assessment ordinal.
    items:
      - id: effective-review-route
        type: choice
        prompt: Record the exact route authorized for the next review operation.
        required: true
        choices:
          - mulgae
          - herdr
          - subagent-review
          - waived
      - id: route-authorization-basis
        type: choice
        prompt: Record whether the route starts from the approved plan, continues a completed checkpoint, resumes an unsettled operation, or comes from an explicit later change or waiver.
        required: true
        choices:
          - approved-plan
          - continued-checkpoint
          - explicit-route-change
          - explicit-waiver
          - resume-current
          - new-review-current-route
      - id: checkpoint-requested-direction
        type: choice
        prompt: Carry the exact direction requested for this checkpoint, or record not-applicable for the initial planned route.
        required: true
        choices:
          - not-applicable
          - continue-current
          - resume-current
          - new-review-current-route
          - switch-route
          - waive
      - id: route-change-authority-reference
        type: text
        prompt: For a completed continuation, explicit change, or waiver, record the user authority and prior operation or completed-checkpoint evidence reference.
        required: false
        required_when:
          - item: route-authorization-basis
            not_equals: approved-plan
        min_length: 1
        max_length: 2000
        multiline: true
      - id: prior-review-operation
        type: choice
        prompt: Carry the prior review operation state from its authoritative evidence, or record not-applicable for the initial planned route.
        required: true
        choices:
          - not-applicable
          - complete
          - incomplete
          - failed
          - waived
      - id: prior-review-route
        type: choice
        prompt: Carry the prior review operation's exact route identity, or record not-applicable for the initial planned route.
        required: true
        choices:
          - not-applicable
          - mulgae
          - orca
          - herdr
          - subagent-review
          - independent-review
          - waived
      - id: prior-route-lifecycle-state
        type: choice
        prompt: Carry the prior native lifecycle, using not-applicable for the first checkpoint.
        required: true
        choices:
          - not-applicable
          - not-started
          - active-or-unknown
          - terminal-incomplete-or-failed
          - terminal-complete
      - id: prior-route-change-readiness
        type: choice
        prompt: Carry whether the prior operation is settled for change or was already completed, or record not-applicable for the initial planned route.
        required: true
        choices:
          - not-applicable
          - current-route-only
          - safe-to-change
          - completed-checkpoint
      - id: prior-assessment-ordinal
        type: integer
        prompt: Record the number of the most recent completed assessment for this goal revision, using zero before the first completed checkpoint.
        required: true
        minimum: 0
      - id: finding-lineage-summary
        type: text
        prompt: Preserve every earlier unresolved or corrected finding identity and its current disposition, or record none for the initial checkpoint.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: remaining-review-authority-summary
        type: text
        prompt: Record the remaining remediation and confirmation authority without resetting it for a route change.
        required: true
        min_length: 1
        max_length: 2000
        multiline: true
      - id: corrected-target-summary
        type: text
        prompt: Record the prior review and target, frozen finding IDs, correction commits or exact source delta, invalidated criteria, directly affected paths, callers, contracts and tests, or state that no correction is pending.
        required: true
        min_length: 1
        max_length: 2000
        multiline: true
      - id: extra-assessment-authority-reference
        type: text
        prompt: Record explicit user authority for an assessment after ordinal four; otherwise leave absent.
        required: false
        required_when:
          - item: prior-assessment-ordinal
            at_least: 4
        min_length: 1
        max_length: 2000
        multiline: true
      - id: route-direction-continuity
        type: check_result
        prompt: Record the caller-supplied continuity result binding the requested checkpoint direction to its exact authorization basis, prior lifecycle, readiness, and effective provider route.
        help: "The declared operation is \"Validate Task checkpoint direction, same-route authority, prior lifecycle, findings, goal revision and ordinal: approved-plan has no prior operation; resume-current after proven not-started repeats preflight and first execution under the unused grant, otherwise continues existing native work or publication; continued-checkpoint follows exact complete or waived readiness and consumes the next ordinal; safe switch or waiver needs explicit authority and preserves pending or advances completed ordinals; new-review-current-route needs explicit one-root authority after terminal failed or incomplete settlement and refreshed current-source inputs. Preserve lineage and remaining authority; resume grants no replay or replacement.\" The matching digest identifies only this abstract slot contract and does not prove that any operation ran."
        required: false
        required_when:
          - item: route-authorization-basis
            not_equals: approved-plan
        operation_id: aquarium-task-review-route-direction-continuity
        operation_digest: sha256:428c03483fc0178e990d9be72ce5283b6d7588479c711ac3347e6bbd639667a9
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  review-route-entry-decision:
    type: decision
    title: Classify the review route entry
    objective: Separate the approved plan route from an explicitly authorized later change before inspecting branch-specific evidence.
    prompt: Is this checkpoint using the planned route or an authorized change?
    options:
      - id: planned
        label: Enter the planned route
        criteria: The checkpoint retains the route approved in the plan.
        guards:
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            equals: approved-plan
          - evidence:
              node: prepare-review
              item: prior-review-operation
            equals: not-applicable
          - evidence:
              node: prepare-review
              item: prior-review-route
            equals: not-applicable
          - evidence:
              node: prepare-review
              item: prior-route-change-readiness
            equals: not-applicable
      - id: changed
        label: Enter an authorized route change
        criteria: The checkpoint records an explicit route change or waiver authority.
        guards:
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            not_equals: approved-plan
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            not_equals: continued-checkpoint
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            not_equals: resume-current
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            not_equals: new-review-current-route
      - id: continued
        label: Continue the completed route
        criteria: The exact completed operation has passing continuity.
        guards:
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            equals: continued-checkpoint
          - evidence:
              node: prepare-review
              item: checkpoint-requested-direction
            equals: continue-current
          - evidence:
              node: prepare-review
              item: route-direction-continuity
            field: outcome
            equals: pass
      - id: resumed
        label: Resume the current route
        criteria: The exact unsettled provider operation has passing continuity.
        guards:
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            equals: resume-current
          - evidence:
              node: prepare-review
              item: checkpoint-requested-direction
            equals: resume-current
          - evidence:
              node: prepare-review
              item: route-direction-continuity
            field: outcome
            equals: pass
      - id: new-review
        label: Authorize a new current-route review
        criteria: The explicitly authorized fresh review preserves the pending ordinal after terminal settlement.
        guards:
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            equals: new-review-current-route
          - evidence:
              node: prepare-review
              item: checkpoint-requested-direction
            equals: new-review-current-route
          - evidence:
              node: prepare-review
              item: route-direction-continuity
            field: outcome
            equals: pass
    reason:
      required: true
      prompt: Explain whether the route comes from the approved plan or later explicit authority.
  review-route-change-state-decision:
    type: decision
    title: Classify the prior review operation
    objective: Route an authorized change according to whether the prior operation was incomplete, failed, or completed.
    prompt: Which prior-operation state governs this route change?
    options:
      - id: unsettled
        label: Prior operation unsettled
        criteria: The exact incomplete or failed state requires safe settlement.
        guards:
          - evidence:
              node: prepare-review
              item: prior-review-operation
            not_equals: complete
          - evidence:
              node: prepare-review
              item: prior-review-operation
            not_equals: waived
          - evidence:
              node: prepare-review
              item: prior-review-operation
            not_equals: not-applicable
      - id: completed
        label: Prior checkpoint completed
        criteria: The exact delegated or waived checkpoint retains its ordinal and lineage after continuity passes.
        guards:
          - evidence:
              node: prepare-review
              item: prior-review-operation
            not_equals: incomplete
          - evidence:
              node: prepare-review
              item: prior-review-operation
            not_equals: failed
          - evidence:
              node: prepare-review
              item: prior-review-operation
            not_equals: not-applicable
          - evidence:
              node: prepare-review
              item: prior-assessment-ordinal
            at_least: 1
    reason:
      required: true
      prompt: Explain the prior operation state that owns the route-change path.
  current-review-route-resume-authorization-decision:
    type: decision
    title: Authorize current review route resume
    objective: Resume only the exact unsettled provider operation that preceded the user's explicit direction.
    prompt: Which current provider route may resume its existing operation?
    options:
      - id: mulgae
        label: Resume Mulgae
        criteria: The preceding unsettled operation belongs to Mulgae and the user explicitly directed current-route resume.
        guards:
          - evidence:
              node: prepare-review
              item: prior-review-route
            equals: mulgae
          - evidence:
              node: prepare-review
              item: effective-review-route
            equals: mulgae
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            equals: resume-current
          - evidence:
              node: prepare-review
              item: checkpoint-requested-direction
            equals: resume-current
      - id: herdr
        label: Resume Herdr
        criteria: The preceding unsettled operation belongs to Herdr and the user explicitly directed current-route resume.
        guards:
          - evidence:
              node: prepare-review
              item: prior-review-route
            equals: herdr
          - evidence:
              node: prepare-review
              item: effective-review-route
            equals: herdr
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            equals: resume-current
          - evidence:
              node: prepare-review
              item: checkpoint-requested-direction
            equals: resume-current
      - id: subagent-review
        label: Resume Subagent Review
        criteria: The preceding unsettled operation belongs to Subagent Review and the user explicitly directed current-route resume.
        guards:
          - evidence:
              node: prepare-review
              item: prior-review-route
            equals: subagent-review
          - evidence:
              node: prepare-review
              item: effective-review-route
            equals: subagent-review
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            equals: resume-current
          - evidence:
              node: prepare-review
              item: checkpoint-requested-direction
            equals: resume-current
    reason:
      required: true
      prompt: Explain how the preceding operation, provider identity, and explicit direction authorize this same-provider resume.
  authorized-review-route-entry-decision:
    type: decision
    title: Enter the authorized review route
    objective: Start only the exact route admitted by the preceding authorization, or return to checkpoint preparation before native work starts.
    prompt: Should the authorized route start from this route-owned entry?
    options:
      - id: start
        label: Start the authorized route
        criteria: The admitted route and its authority remain current and native work may start.
      - id: reprepare
        label: Reprepare the review checkpoint
        criteria: The admitted route or its authority needs correction before native work starts.
    reason:
      required: true
      prompt: Explain whether the authorized route may start or why its checkpoint must be prepared again.
  planned-review-route-authorization-decision:
    type: decision
    title: Authorize the planned review route
    objective: Admit only the route selected by the approved plan.
    prompt: Which planned route applies to the next review operation?
    options:
      - id: planned-mulgae
        label: Use planned Mulgae route
        criteria: The approved plan and effective checkpoint route are both Mulgae.
        guards:
          - evidence:
              node: record-plan
              item: review-route
            equals: mulgae
          - evidence:
              node: prepare-review
              item: effective-review-route
            equals: mulgae
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            equals: approved-plan
          - evidence:
              node: prepare-review
              item: checkpoint-requested-direction
            equals: not-applicable
      - id: planned-herdr
        label: Use planned Herdr route
        criteria: The approved plan and effective checkpoint route are both Herdr.
        guards:
          - evidence:
              node: record-plan
              item: review-route
            equals: herdr
          - evidence:
              node: prepare-review
              item: effective-review-route
            equals: herdr
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            equals: approved-plan
          - evidence:
              node: prepare-review
              item: checkpoint-requested-direction
            equals: not-applicable
      - id: planned-subagent-review
        label: Use planned Subagent Review route
        criteria: The approved plan and effective checkpoint route are both Subagent Review.
        guards:
          - evidence:
              node: record-plan
              item: review-route
            equals: subagent-review
          - evidence:
              node: prepare-review
              item: effective-review-route
            equals: subagent-review
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            equals: approved-plan
          - evidence:
              node: prepare-review
              item: checkpoint-requested-direction
            equals: not-applicable
      - id: planned-waiver
        label: Use planned waiver route
        criteria: The approved plan and effective checkpoint route are both the explicit waiver.
        guards:
          - evidence:
              node: record-plan
              item: review-route
            equals: waived
          - evidence:
              node: prepare-review
              item: effective-review-route
            equals: waived
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            equals: approved-plan
          - evidence:
              node: prepare-review
              item: checkpoint-requested-direction
            equals: not-applicable
    reason:
      required: true
      prompt: Explain the planned route and its preserved approval basis.
  incomplete-review-route-authorization-decision:
    type: decision
    title: Authorize a review route change after an incomplete operation
    objective: Admit only an explicitly authorized route change after an incomplete or failed operation is safe to leave.
    prompt: Which route change applies after the incomplete or failed review operation?
    options:
      - id: changed-mulgae
        label: Use explicitly changed Mulgae route
        criteria: A later explicit route change with prior-checkpoint lineage authorizes Mulgae.
        guards:
          - evidence:
              node: prepare-review
              item: effective-review-route
            equals: mulgae
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            equals: explicit-route-change
          - evidence:
              node: prepare-review
              item: prior-route-change-readiness
            equals: safe-to-change
          - evidence:
              node: prepare-review
              item: checkpoint-requested-direction
            equals: switch-route
      - id: changed-herdr
        label: Use explicitly changed Herdr route
        criteria: A later explicit route change with prior-checkpoint lineage authorizes Herdr.
        guards:
          - evidence:
              node: prepare-review
              item: effective-review-route
            equals: herdr
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            equals: explicit-route-change
          - evidence:
              node: prepare-review
              item: prior-route-change-readiness
            equals: safe-to-change
          - evidence:
              node: prepare-review
              item: checkpoint-requested-direction
            equals: switch-route
      - id: changed-subagent-review
        label: Use explicitly changed Subagent Review route
        criteria: A later explicit route change with prior-checkpoint lineage authorizes Subagent Review.
        guards:
          - evidence:
              node: prepare-review
              item: effective-review-route
            equals: subagent-review
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            equals: explicit-route-change
          - evidence:
              node: prepare-review
              item: prior-route-change-readiness
            equals: safe-to-change
          - evidence:
              node: prepare-review
              item: checkpoint-requested-direction
            equals: switch-route
      - id: changed-waiver
        label: Use explicitly authorized waiver
        criteria: A later explicit waiver with prior-checkpoint lineage authorizes coordinator assessment.
        guards:
          - evidence:
              node: prepare-review
              item: effective-review-route
            equals: waived
          - evidence:
              node: prepare-review
              item: route-authorization-basis
            equals: explicit-waiver
          - evidence:
              node: prepare-review
              item: prior-route-change-readiness
            equals: safe-to-change
          - evidence:
              node: prepare-review
              item: checkpoint-requested-direction
            equals: waive
    reason:
      required: true
      prompt: Explain the changed route, explicit authority, and safe incomplete-operation settlement.
  completed-review-route-authorization-decision:
    type: decision
    title: Authorize a review route change after a completed checkpoint
    objective: Admit only an explicitly authorized route change that preserves completed-checkpoint lineage.
    prompt: Which route change applies after the completed review checkpoint?
    options:
      - id: completed-change-mulgae
        label: Change a completed checkpoint to Mulgae
        criteria: Explicit authority changes a previously completed checkpoint to Mulgae while preserving its lineage.
        guards:
          - evidence:
              node: prepare-review
