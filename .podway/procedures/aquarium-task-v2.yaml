  review-record:
    type: action
    title: Record selected completion review
    intent: Record the route-specific operation, evidence, completion assessment, and adjudicated findings without claiming another backend's guarantees.
    instructions:
      - New Mulgae roots use live_source v1 and project binding only; keep workspace/index unchanged through terminal completion. Terminal failure permits no rerun or compose; a fresh root needs explicit new-review-current-route authority after settlement and preserves the pending ordinal.
      - Use task-review for the route selected in the approved plan and the exact named Task candidate, including its goal, authorities, work commits or native source identity, changed paths, artifacts, verification evidence, and excluded state; preserve route-specific lifecycle evidence, provenance, backend checks, and finding lineage.
      - Review is report-only; do not edit files or start another root solely because eligible Low findings exist.
      - An incomplete or failed operation consumes no assessment ordinal and stops for explicit route direction without automatic fallback.
      - Deliver the complete aquarium.executor-handoff/v3 with original evidence, actual candidate, checks, authority and gaps. Record actual returned work and available public handles; unavailable telemetry remains unknown. Complete this ordinary Action with current fences; delivery is not Evaluator passage.
      - Use the review result handoff contract to collect every expected report through its actual native surface, record producer and receiver observations, and recover the same operation before considering fresh review; carry prior finding decisions and correction reasons in the Brief.
    items:
      - id: review-route
        type: choice
        prompt: Record the effective route for this operation.
        required: true
        choices:
          - mulgae
          - herdr
          - subagent-review
          - waived
      - id: review-operation
        type: choice
        prompt: Record the authoritative operation state.
        required: true
        choices:
          - complete
          - incomplete
          - failed
          - waived
      - id: assessment-ordinal
        type: integer
        prompt: Record zero when an incomplete or failed operation consumed no assessment, or the positive ordinal for a completed delegated review or waiver assessment.
        required: true
        minimum: 0
      - id: assessment-ordinal-continuity
        type: check_result
        prompt: Record the caller-supplied result for aquarium-task-review-ordinal-continuity; Podway does not execute or attest the operation.
        help: The declared operation is "Verify that the completed Task review consumes exactly the next assessment ordinal for the current goal revision, uses work-unit for ordinals one through three and remediation-confirmation for ordinal four or later, and requires explicit user authority after ordinal four." The matching digest identifies only this abstract slot contract and does not prove that the check ran.
        required: true
        operation_id: aquarium-task-review-ordinal-continuity
        operation_digest: sha256:583d4da553c2e3f7b69dc35f5c49b28333e4e38fcebc3048f5de5c49a14eb493
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
      - id: review-mode
        type: choice
        prompt: Record whether this round may trigger remediation or is confirmation-only.
        required: true
        choices:
          - remediation-eligible
          - confirmation-only
      - id: assessment-kind
        type: choice
        prompt: Record whether this checkpoint evaluates the named Task work unit or confirms its frozen remediation set.
        required: true
        choices:
          - work-unit
          - remediation-confirmation
      - id: review-source-contract
        type: choice
        prompt: Record live-source-v1 for new Mulgae execution, historical-capture for an existing captured result, or not-applicable for another route or closeout substitute.
        required: true
        choices:
          - mulgae-live-source-v1
          - mulgae-historical-capture
          - not-applicable
      - id: review-source-binding
        type: text
        prompt: Preserve the public preflight target and digest, receipt-bound run digest, scope-derived consistency, applicable staged content binding and caller observation when available; state pending or unavailable facts explicitly. Metadata is not source content. Other routes record not-applicable.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: review-evidence-reference
        type: text
        prompt: Record bounded native lifecycle, all expected Subagent base and UI reviewer references or Herdr main and child references, production, submission and actual recipient readback when selected, preflight-failure, or waiver evidence for this checkpoint.
        required: true
        min_length: 1
        max_length: 2000
        multiline: true
      - id: backend-check-result
        type: choice
        prompt: Record the authoritative native backend check, or not-provided when the selected route has no backend check.
        required: true
        choices:
          - pass
          - fail
          - not-provided
      - id: assessment-provenance
        type: text
        prompt: Record bounded reviewer provenance, or coordinator-waiver for an explicit waiver.
        required: true
        min_length: 1
        max_length: 1000
        multiline: true
      - id: assessment-provenance-kind
        type: choice
        prompt: Classify whether the assessment came from a delegated reviewer or an explicit coordinator waiver.
        required: true
        choices:
          - delegated-reviewer
          - coordinator-waiver
      - id: waiver-summary
        type: text
        prompt: For a waived route, record explicit authority, target, reason, and assurance limitation; otherwise leave absent.
        required: false
        min_length: 1
        max_length: 3000
        multiline: true
      - id: review-summary
        type: text
        prompt: Record target, route-specific operation and coverage, backend check, finding evidence, and dispositions without claiming another backend's guarantees.
        required: true
        min_length: 1
        max_length: 6000
        multiline: true
      - id: completion-assessment-summary
        type: text
        prompt: Record each actual requirement by stable criterion identity, responsible owner, met, unmet, unverified, or not-applicable state, and bounded evidence or reference provenance; do not copy full reports or private provider payloads.
        required: true
        min_length: 1
        max_length: 7000
        multiline: true
      - id: completion-unmet-criteria
        type: integer
        prompt: Record the number of actual requirements assessed as unmet across all accepted selected-role reports.
        required: true
        minimum: 0
      - id: completion-unverified-criteria
        type: integer
        prompt: Record the number of actual requirements assessed as unverified across all accepted selected-role reports.
        required: true
        minimum: 0
      - id: reported-severity-summary
        type: text
        prompt: Record finding IDs and reviewer-reported severities before local adjudication, or none.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: effective-medium-or-higher-findings
        type: integer
        prompt: Record the number of valid unresolved findings with effective priority Blocker, Critical, High, or Medium.
        required: true
        minimum: 0
      - id: effective-low-findings
        type: integer
        prompt: Record the number of valid Low findings that require a completed shared disposition.
        required: true
        minimum: 0
      - id: finding-count-consistency
        type: choice
        prompt: Record whether unresolved-valid-findings equals the sum of the effective Medium-or-higher and Low finding counts.
        required: true
        choices:
          - consistent
          - inconsistent
      - id: confirmation-needed-findings
        type: integer
        prompt: Record the number of findings whose validity still needs confirmation.
        required: true
        minimum: 0
      - id: unresolved-valid-findings
        type: integer
        prompt: Record the number of unresolved valid findings.
        required: true
        minimum: 0
      - id: unresolved-implementation-findings
        type: integer
        prompt: Record the native number of unresolved Medium-or-higher findings owned by implementation or refinement; this source fact is descriptive and does not select a rework owner.
        required: true
        minimum: 0
      - id: unresolved-documentation-findings
        type: integer
        prompt: Record the native number of unresolved Medium-or-higher findings owned by documentation; this source fact is descriptive and does not select a rework owner.
        required: true
        minimum: 0
      - id: implementation-rework-obligations
        type: integer
        prompt: Record the routing total for backend-check remediation, unresolved implementation or refinement findings, and unmet completion criteria owned by implementation or refinement.
        required: true
        minimum: 0
      - id: documentation-rework-obligations
        type: integer
        prompt: Record unresolved documentation findings plus unmet completion criteria owned by documentation.
        required: true
        minimum: 0
      - id: verification-rework-obligations
        type: integer
        prompt: Record unmet completion criteria owned by verification. Assign every unmet criterion to implementation or refinement, verification, or documentation before routing.
        required: true
        minimum: 0
      - id: executor-handoff
        type: artifact
        prompt: Reference the complete aquarium.executor-handoff/v3 candidate, exact target, requirement basis, checks, authority, gaps and actual results and available public native handles.
        required: true
        allowed_media_types:
          - application/json
      - id: local-correction-count
        type: integer
        prompt: Record eligible local correction candidates separately from source severity counts; use zero when none apply.
        required: true
        minimum: 0
      - id: local-correction-eligibility
        type: check_result
        prompt: Bind the frozen candidate correction set, original coverage, all current blockers, affected criteria, direct checks and existing effect authority; this is caller-recorded eligibility, not repair evidence.
        required: true
        operation_id: aquarium-local-correction-eligibility
        operation_digest: sha256:c5d1ce604e86d6768f498be4618d6d30935d0b3134ab5290ebbcd0ac82f11c13
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  review-route-binding-decision:
    type: decision
    title: Bind review record to authorized route
    objective: Reject a review record whose route differs from the authorized checkpoint route.
    prompt: Does the review record use the authorized route?
    options:
      - id: mulgae
        label: Authorized Mulgae record
        criteria: The prepared and recorded routes are both Mulgae.
        guards:
          - evidence:
              node: prepare-review
              item: effective-review-route
            equals: mulgae
          - evidence:
              node: review
              item: review-route
            equals: mulgae
      - id: herdr
        label: Authorized Herdr record
        criteria: The prepared and recorded routes are both Herdr.
        guards:
          - evidence:
              node: prepare-review
              item: effective-review-route
            equals: herdr
          - evidence:
              node: review
              item: review-route
            equals: herdr
      - id: subagent-review
        label: Authorized Subagent Review record
        criteria: The prepared and recorded routes are both Subagent Review.
        guards:
          - evidence:
              node: prepare-review
              item: effective-review-route
            equals: subagent-review
          - evidence:
              node: review
              item: review-route
            equals: subagent-review
      - id: waived
        label: Authorized waiver record
        criteria: The prepared and recorded routes are both waived.
        guards:
          - evidence:
              node: prepare-review
              item: effective-review-route
            equals: waived
          - evidence:
              node: review
              item: review-route
            equals: waived
          - evidence:
              node: review
              item: review-operation
            equals: waived
          - evidence:
              node: review
              item: assessment-ordinal
            at_least: 1
    reason:
      required: true
      prompt: Explain the authorized and recorded route identity.
  review-operation-decision:
    type: decision
    title: Classify review operation
    objective: Admit delegated-review semantics only after an exact completed or unsettled operation.
    prompt: What authoritative operation state was recorded?
    evidence_guidance:
      - Completed delegated routes use complete. Waiver records bypass this delegated-operation decision, while failed or incomplete operations stop for explicit route direction without consuming an ordinal.
    options:
      - id: assessed
        label: Review assessment completed
        criteria: The exact complete delegated operation remains in review evidence and consumed a positive assessment ordinal.
        guards:
          - evidence:
              node: review
              item: review-operation
            equals: complete
          - evidence:
              node: review
              item: assessment-ordinal
            at_least: 1
      - id: unsettled
        label: Review operation unsettled
        criteria: The exact incomplete or failed operation consumed no assessment ordinal.
        guards:
          - evidence:
              node: review
              item: review-route
            not_equals: waived
          - evidence:
              node: review
              item: review-operation
            not_equals: complete
          - evidence:
              node: review
              item: review-operation
            not_equals: waived
          - evidence:
              node: review
              item: assessment-ordinal
            equals: 0
    reason:
      required: true
      prompt: Explain the operation state and ordinal treatment using authoritative route evidence.
  assessment-ordinal-decision:
    type: decision
    title: Validate assessment ordinal
    objective: Consume exactly the next bounded ordinal after a completed delegated review or waiver assessment.
    prompt: Does this completed checkpoint use the next authorized assessment ordinal?
    options:
      - id: work-unit
        label: Work-unit assessment
        criteria: Ordinals one through three evaluate the exact named Task under remediation authority; the continuity check verifies the exact next ordinal.
        guards:
          - evidence:
              node: review
              item: assessment-ordinal
            at_most: 3
          - evidence:
              node: review
              item: assessment-kind
            equals: work-unit
          - evidence:
              node: review
              item: review-mode
            equals: remediation-eligible
          - evidence:
              node: review
              item: assessment-ordinal-continuity
            field: outcome
            equals: pass
      - id: remediation-confirmation
        label: Remediation confirmation
        criteria: Ordinal four or a user-authorized later checkpoint confirms only the frozen correction set and its direct regression surface; the continuity check verifies any required extra authority.
        guards:
          - evidence:
              node: review
              item: assessment-ordinal
            at_least: 4
          - evidence:
              node: review
              item: assessment-kind
            equals: remediation-confirmation
          - evidence:
              node: review
              item: review-mode
            equals: confirmation-only
          - evidence:
              node: review
              item: assessment-ordinal-continuity
            field: outcome
            equals: pass
    reason:
      required: true
      prompt: Explain the prior completed ordinal and authority for this newly consumed checkpoint.
  review-evidence-decision:
    type: decision
    title: Validate route-specific review evidence
    objective: Admit only the completed evidence combinations supported by the selected route.
    prompt: Which valid route-specific evidence combination completed?
    evidence_guidance:
      - Reject cross-backend claims, missing Mulgae CI, delegated coordinator-waiver provenance, and waiver records without their explicit summary.
    options:
      - id: mulgae
        label: Mulgae review evidence
        criteria: Mulgae completed with exact native evidence, reviewer provenance, and the exact supplied backend result retained in evidence.
        guards:
          - evidence:
              node: review
              item: review-route
            equals: mulgae
          - evidence:
              node: review
              item: review-operation
            equals: complete
          - evidence:
              node: review
              item: backend-check-result
            not_equals: not-provided
      - id: static-delegated
        label: Static delegated review evidence
        criteria: The exact Herdr route or complete expected Subagent reviewer team remains in evidence without a backend check claim.
        guards:
          - evidence:
              node: review
              item: review-route
            not_equals: mulgae
          - evidence:
              node: review
              item: review-route
            not_equals: waived
          - evidence:
              node: review
              item: review-operation
            equals: complete
          - evidence:
              node: review
              item: backend-check-result
            equals: not-provided
      - id: waived
        label: Explicit waiver assessment
        criteria: The coordinator completed the explicitly authorized waiver assessment with its assurance limitation.
        guards:
          - evidence:
              node: review
              item: review-route
            equals: waived
          - evidence:
              node: review
              item: review-operation
            equals: waived
          - evidence:
              node: review
              item: backend-check-result
            equals: not-provided
    reason:
      required: true
      prompt: Explain why the selected route's completed evidence combination is admissible.
  incomplete-review-evidence-decision:
    type: decision
    title: Validate incomplete route evidence
    objective: Admit only failed or incomplete evidence combinations supported by the selected delegated route.
    prompt: Which valid route-specific operation evidence was retained?
    evidence_guidance:
      - Static routes never claim a backend check, delegated routes never use coordinator-waiver provenance, and a waiver never records failed or incomplete.
    options:
      - id: mulgae
        label: Incomplete Mulgae operation evidence
        criteria: The exact backend result remains in evidence for the incomplete or failed Mulgae operation.
        guards:
          - evidence:
              node: review
              item: review-route
            equals: mulgae
      - id: static-delegated
        label: Incomplete static delegated operation evidence
        criteria: The exact Herdr or Subagent Review route remains in evidence and retained provenance without a backend check claim.
        guards:
          - evidence:
              node: review
              item: review-route
            not_equals: mulgae
          - evidence:
              node: review
              item: review-route
            not_equals: waived
          - evidence:
              node: review
              item: backend-check-result
            equals: not-provided
    reason:
      required: true
      prompt: Explain why the failed or incomplete evidence combination is admissible for the selected route.
  review-provenance-decision:
    type: decision
    title: Validate review provenance
    objective: Keep delegated-review provenance separate from explicit waiver evidence for both completed and incomplete operations.
    prompt: Which provenance and waiver-evidence combination applies to this operation?
    options:
      - id: delegated
        label: Delegated review provenance
        criteria: A delegated route has reviewer provenance and a retained evidence reference.
        guards:
          - evidence:
              node: review
              item: review-operation
            not_equals: waived
          - evidence:
              node: review
              item: assessment-provenance-kind
            equals: delegated-reviewer
          - evidence:
              node: review
              item: review-evidence-reference
            non_empty: true
      - id: waived
        label: Coordinator waiver provenance
        criteria: A completed waiver assessment has coordinator provenance and an explicit assurance summary.
        guards:
          - evidence:
              node: review
              item: review-operation
            equals: waived
          - evidence:
              node: review
              item: assessment-provenance-kind
            equals: coordinator-waiver
          - evidence:
              node: review
              item: waiver-summary
            non_empty: true
          - evidence:
              node: review
              item: review-evidence-reference
            non_empty: true
    reason:
      required: true
      prompt: Explain the authoritative reviewer or waiver provenance.
  review-decision:
    type: decision
    title: Classify review findings
    objective: Classify the settled finding state independently from backend checks, completion, and phase ownership.
    prompt: What finding state remains after confirmation?
    evidence_guidance:
      - Use finding counts only; completion and backend checks are admitted by earlier serial decisions.
    options:
      - id: clean
        label: Findings clean
        criteria: No valid unresolved Medium-or-higher or Low finding remains.
        guards:
          - evidence:
              node: review
              item: finding-count-consistency
            equals: consistent
          - evidence:
              node: review
              item: unresolved-valid-findings
            equals: 0
          - evidence:
              node: review
              item: effective-medium-or-higher-findings
            equals: 0
          - evidence:
              node: review
              item: effective-low-findings
            equals: 0
      - id: blocking
        label: Blocking findings remain
        criteria: At least one valid Medium-or-higher finding requires owned remediation.
        guards:
          - evidence:
              node: review
              item: finding-count-consistency
            equals: consistent
          - evidence:
              node: review
              item: effective-medium-or-higher-findings
            at_least: 1
      - id: low-disposition
        label: Complete Low dispositions
        criteria: No valid Medium-or-higher finding remains and at least one valid Low finding requires shared local disposition.
        guards:
          - evidence:
              node: review
              item: finding-count-consistency
            equals: consistent
          - evidence:
              node: review
              item: effective-medium-or-higher-findings
            equals: 0
          - evidence:
              node: review
              item: effective-low-findings
            at_least: 1
      - id: inconsistent
        label: Finding evidence inconsistent
        criteria: The unresolved total does not equal the sum of the supported severity buckets.
        guards:
          - evidence:
              node: review
              item: finding-count-consistency
            equals: inconsistent
    reason:
      required: true
      prompt: Explain the decision using the recorded review evidence.
  review-confirmation-decision:
    type: decision
    title: Confirm review findings
    objective: Admit review routing only after every finding has a supported validity disposition.
    prompt: Have all findings that needed confirmation been resolved?
    evidence_guidance:
      - Resolve each finding to Valid or Invalid with authorized evidence or bounded confirmation authority, then manually rework review when any confirmation remains.
    options:
      - id: resolved
        label: Findings confirmed
        criteria: No finding still needs confirmation.
        guards:
          - evidence:
              node: review
              item: confirmation-needed-findings
            equals: 0
      - id: unresolved
        label: Confirmation required
        criteria: At least one finding still needs a supported validity disposition before review routing.
        guards:
          - evidence:
              node: review
              item: confirmation-needed-findings
            at_least: 1
    reason:
      required: true
      prompt: Explain the selection using the recorded finding dispositions.
  completion-status-decision:
    type: decision
    title: Classify completion status
    objective: Classify completion independently from backend checks, findings, and rework ownership.
    prompt: What is the aggregate completion state?
    evidence_guidance:
      - Unmet criteria may proceed to owned rework; unverified criteria require current evidence or bounded confirmation first.
    options:
      - id: complete
        label: Assessment passed
        criteria: All actual current phase obligations and applicable parent constraints are satisfied. Preserve global gaps and original negative-result routing without claiming whole-goal achievement.
        guards:
          - evidence:
              node: evaluator-review
              item: evaluator-applicability
            field: outcome
            equals: pass
          - evidence:
              node: evaluator-review
              item: evaluator-checkpoint-result
            field: outcome
            equals: pass
      - id: inapplicable
        label: Assessment inapplicable
        criteria: The report lacks current complete applicability; repair original evidence or candidate applicability without relabeling the report.
        guards:
          - evidence:
              node: evaluator-review
              item: evaluator-applicability
            field: outcome
            not_equals: pass
      - id: rework
        label: Established correction required
        criteria: An actual current phase obligation or applicable parent constraint failed. Preserve original gaps and require the existing exact correction authority before rework.
        guards:
          - evidence:
              node: evaluator-review
              item: evaluator-applicability
            field: outcome
            equals: pass
          - evidence:
              node: evaluator-review
              item: evaluator-checkpoint-result
            field: outcome
            equals: fail
      - id: evidence-needed
        label: Evidence required
        criteria: Actual current phase work or its required evidence remains unverified. Preserve original gaps and use the existing evidence owner and authority without redispatching uncertain work.
        guards:
          - evidence:
              node: evaluator-review
              item: evaluator-applicability
            field: outcome
            equals: pass
          - evidence:
              node: evaluator-review
              item: evaluator-checkpoint-result
            field: outcome
            equals: inconclusive
    reason:
      required: true
      prompt: Explain the selection using the criterion assessment and current evidence.
  backend-check-decision:
    type: decision
    title: Evaluate backend check
    objective: Keep an optional native backend check separate from workflow verification and semantic review decisions.
    prompt: What backend check result applies to the admitted route evidence?
    options:
      - id: non-failing
        label: Backend check does not require remediation
        criteria: The exact pass or not-provided result remains in review evidence and does not create backend remediation work.
        guards:
          - evidence:
              node: review
              item: backend-check-result
            not_equals: fail
      - id: failed
        label: Backend check failed
        criteria: The selected backend supplied a failing check that requires owned remediation.
        guards:
          - evidence:
              node: review
              item: backend-check-result
            equals: fail
    reason:
      required: true
      prompt: Explain the selection using the admitted route and recorded backend-check result.
  task-rework-authority-decision:
    type: decision
    title: Evaluate task rework authority
    objective: Keep the existence and phase ownership of task rework separate from authority for another correction and review pass.
    prompt: What authority applies to the established task rework?
    options:
      - id: remediation
        label: Use current remediation authority
        criteria: The current review is remediation-eligible.
        guards:
          - evidence:
              node: review
              item: review-mode
            equals: remediation-eligible
      - id: user-direction
        label: Await user direction
        criteria: Confirmation-only rework always requires a fresh one-shot user decision.
        guards:
          - evidence:
              node: review
              item: review-mode
            equals: confirmation-only
    reason:
      required: true
      prompt: Explain remaining authority and the exact current rework basis, including a blocker established during Low settlement and its current target when applicable.
  implementation-owner-decision:
    type: decision
    title: Route implementation ownership
    objective: Give implementation and refinement the first deterministic opportunity to own rework.
    prompt: Does implementation or refinement own any current rework obligation?
    evidence_guidance:
      - Before rework, put the exact source attempt and record identity, target, finding or failed-check IDs, admitted correction authority, and phase obligations in the decision reason
      - On entry, match the native rework history target_attempt_id to the current attempt and record that bounded cause as new evidence; stale source records are historical provenance, not fresh evidence.
    options:
      - id: required
        label: Implementation rework required
        criteria: Implementation or refinement owns at least one obligation after rework authority was admitted.
        guards:
          - evidence:
              node: record-task-rework-basis
              item: implementation-rework-obligations
            at_least: 1
      - id: clear
        label: Implementation ownership clear
        criteria: Implementation or refinement owns no obligation after rework authority was admitted.
        guards:
          - evidence:
              node: record-task-rework-basis
              item: implementation-rework-obligations
            equals: 0
    reason:
      required: true
      prompt: Carry the exact current rework basis, phase obligations, and admitted authority into the native rework reason.
  verification-owner-decision:
    type: decision
    title: Route verification ownership
    objective: Route verification work only after implementation ownership is clear.
    prompt: Does verification own any current rework obligation?
    evidence_guidance:
      - Before rework, put the exact source attempt and record identity, target, finding or failed-check IDs, admitted correction authority, and phase obligations in the decision reason
      - On entry, match the native rework history target_attempt_id to the current attempt and record that bounded cause as new evidence; stale source records are historical provenance, not fresh evidence.
    options:
      - id: required
        label: Verification rework required
        criteria: Verification owns at least one obligation after rework authority was admitted.
        guards:
          - evidence:
              node: record-task-rework-basis
              item: verification-rework-obligations
            at_least: 1
      - id: clear
        label: Verification ownership clear
        criteria: Verification owns no obligation after rework authority was admitted.
        guards:
          - evidence:
              node: record-task-rework-basis
              item: verification-rework-obligations
            equals: 0
    reason:
      required: true
      prompt: Carry the exact current rework basis, phase obligations, and admitted authority into the native rework reason.
  documentation-owner-decision:
    type: decision
    title: Route documentation ownership
    objective: Route documentation work only after implementation and verification ownership are clear.
    prompt: Does documentation own any current rework obligation?
    evidence_guidance:
      - Before rework, put the exact source attempt and record identity, target, finding or failed-check IDs, admitted correction authority, and phase obligations in the decision reason
      - On entry, match the native rework history target_attempt_id to the current attempt and record that bounded cause as new evidence; stale source records are historical provenance, not fresh evidence.
    options:
      - id: required
        label: Documentation rework required
        criteria: Documentation owns at least one obligation after rework authority was admitted.
        guards:
          - evidence:
              node: record-task-rework-basis
              item: documentation-rework-obligations
            at_least: 1
      - id: clear
        label: Documentation ownership clear
        criteria: Documentation owns no obligation, so the admitted gap evidence is inconsistent and must be reviewed again.
        guards:
          - evidence:
              node: record-task-rework-basis
              item: documentation-rework-obligations
            equals: 0
    reason:
      required: true
      prompt: Carry the exact current rework basis, phase obligations, and admitted authority into the native rework reason.
  review-route-direction-record:
    type: action
    title: Await review route direction
    intent: Preserve failed or incomplete operation evidence and record the bounded choices without selecting for the user.
    instructions:
      - Record the selected route, last authoritative native state, every issued reference, settlement state, and supported recovery choices.
      - Do not launch another reviewer, waive review, cancel native work, or consume an assessment ordinal while recording this action.
      - A switch or waiver is admissible only after active or uncertain native work reaches an authoritative safe state through its owner.
    items:
      - id: prior-route-lifecycle-state
        type: choice
        prompt: Record the prior route's authoritative lifecycle state.
        required: true
        choices:
          - not-started
          - active-or-unknown
          - terminal-incomplete-or-failed
      - id: route-change-readiness
        type: choice
        prompt: Record whether another route or waiver may start from the authoritative prior state.
        required: true
        choices:
          - current-route-only
          - safe-to-change
      - id: requested-route-direction
        type: choice
        prompt: Record the user's exact bounded direction for the unsettled review operation.
        required: true
        choices:
          - resume-current
          - new-review-current-route
          - switch-route
          - waive
          - stop
      - id: route-direction-summary
        type: text
        prompt: Record the operation gap, native state and references, settlement evidence, and bounded choices.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: route-transition-admission
        type: check_result
        prompt: Record the caller-supplied result binding the lifecycle state, route-change readiness, and requested direction for this unsettled operation.
        help: The declared operation is "Validate that the recorded prior review lifecycle and requested direction admit same-provider resume, one explicitly authorized new Mulgae review after terminal settlement, safe route switch or waiver, or stop without changing native state. For an authoritatively not-started preflight or prerequisite failure, same-provider resume repeats preflight and first execution under the unused review grant; an uncertain start and review_preparation_failed cannot use this path." The matching digest identifies only this abstract slot contract and does not prove that any operation ran.
        required: true
        operation_id: review-route-transition-admission
        operation_digest: sha256:22af97b8d2d1d7466e44fecb7865148951fd1b4cf984e4190bbc2424aeb88eb9
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  review-route-direction-decision:
    type: decision
    title: Record review route direction
    objective: Continue only from the user's actual bounded recovery choice.
    prompt: What did the user direct for the incomplete or failed review operation?
    evidence_guidance:
      - Leave this decision unset until the user explicitly chooses; switch-route and waive additionally require authoritative safe-state evidence from the prior route owner.
    options:
      - id: continue
        label: Continue the admitted direction
        criteria: The caller-supplied transition admission passed for either same-provider resume or a safe route change or waiver.
        guards:
          - evidence:
              node: record-review-route-direction
              item: requested-route-direction
            not_equals: stop
          - evidence:
              node: record-review-route-direction
              item: route-transition-admission
            field: outcome
            equals: pass
      - id: stop
        label: Stop Task advancement
        criteria: The recorded user direction stops Aquarium advancement without implying native cancellation or settlement.
        guards:
          - evidence:
              node: record-review-route-direction
              item: requested-route-direction
            equals: stop
    reason:
      required: true
      prompt: Record the explicit user direction, prior route state, and bounded authority.
  review-route-stop-record:
    type: action
    title: Record unsuccessful review stop
    intent: End Aquarium advancement without claiming review completion or native cancellation.
    instructions:
      - Preserve the prior route identity and last authoritative state; active or unknown native work remains with its owner unless separately authorized cancellation occurs.
      - This record supports only a not-achieved task assessment.
    items:
      - id: route-stop-classification
        type: choice
        prompt: Record the unsuccessful workflow stop classification.
        required: true
        choices:
          - stopped-unsuccessfully
      - id: route-stop-summary
        type: text
        prompt: Record the retained operation evidence, native ownership, and absence of successful review completion.
        required: true
        min_length: 1
        max_length: 3000
        multiline: true
  user-direction-record:
    type: action
    title: Await user direction
    intent: Record exhausted task rework authority without choosing for the user.
    instructions:
      - Record the exact blocking issue set, reviewed target, and exhausted review authority, then stop at choose-user-direction until the user answers.
      - Completing this action grants no source change, review, commit, or risk-acceptance authority.
    items:
      - id: direction-classification
        type: choice
        prompt: Record the classification that requires an external decision.
        required: true
        choices:
          - user-direction
      - id: direction-summary
        type: text
        prompt: Record the exact issue set, current target, remaining evidence, and bounded choices.
        required: true
        min_length: 1
        max_length: 3000
        multiline: true
  user-direction-decision:
    type: decision
    title: Record user direction
    objective: Continue only from the user's actual bounded choice.
    prompt: What did the user direct for the blocked task?
    evidence_guidance:
      - Leave this decision unset until the user explicitly selects one bounded outcome.
    options:
      - id: fix-and-review
        label: Authorize one fix and review
        criteria: The user authorized exactly one bounded correction and next-ordinal confirmation.
      - id: stop
        label: Stop the task
        criteria: The user chose to stop without another correction or review.
    reason:
      required: true
      prompt: Record the actual user direction and exact authority.
  low-disposition-record:
    type: action
    title: Record verified local settlement
    intent: Verify eligible local corrections and ordinary Low dispositions without claiming provider coverage of changed bytes.
    instructions:
      - Freeze the source finding set, priorities, criterion rows and reviewed basis. Apply only admitted local-verified-fix corrections and ordinary Low dispositions under existing effect authority.
      - Run every affected required check on the final target and reassess affected criteria under coordinator provenance. Preserve unaffected rows only with current applicability evidence; never rewrite the source reviewer assessment.
      - Bind exact before and after targets, permitted delta, zero pending local corrections and Low dispositions, current blockers and criterion gaps. A failed or inconclusive check remains incomplete; use its owner rather than dispatching a cleaner review.
      - The required final Evaluator reads every original criterion and the complete settlement composition. Another provider operation or ordinal is not required solely for eligible local settlement.
    items:
      - id: source-review-basis
        type: text
        prompt: Record the route evidence reference or direct-audit basis, effective result, reviewed target, goal revision, and finite finding-set identity.
        required: true
        min_length: 1
        max_length: 2000
        multiline: true
      - id: low-disposition-summary
        type: text
        prompt: Record every source finding ID and original priority, local-verified-fix or ordinary Low disposition, eligibility basis, exact delta, affected criteria, authority, checks and any canonical future-work owner.
        required: true
        min_length: 1
        max_length: 7000
        multiline: true
      - id: completion-assessment-summary
        type: text
        prompt: Record current criterion-level completion after verified local corrections; identify resolved source rows and coordinator provenance, and preserve unaffected rows with their applicability basis.
        required: true
        min_length: 1
        max_length: 7000
        multiline: true
      - id: completion-unmet-criteria
        type: integer
        prompt: Record the current unmet criterion count for the final settlement target, retaining original source counts separately.
        required: true
        minimum: 0
      - id: completion-unverified-criteria
        type: integer
        prompt: Record the current unverified criterion count for the final settlement target, retaining original source counts separately.
        required: true
        minimum: 0
      - id: pending-low-dispositions
        type: integer
        prompt: Record the number of frozen eligible Low findings without a completed required disposition.
        required: true
        minimum: 0
      - id: pending-local-corrections
        type: integer
        prompt: Record frozen local-verified-fix corrections not yet completed and directly verified; ordinary Low-only settlement records zero.
        required: true
        minimum: 0
      - id: current-blocking-findings
        type: integer
        prompt: Count current obligations that cannot remain in eligible local settlement, including lost eligibility and nonlocal findings. Still-eligible repairs awaiting checks remain pending local corrections.
        required: true
        minimum: 0
      - id: before-target
        type: text
        prompt: Record the exact target reviewed by the source review or audit.
        required: true
        min_length: 1
        max_length: 512
        multiline: true
      - id: after-target
        type: text
        prompt: Record the exact current target after the permitted disposition delta.
        required: true
        min_length: 1
        max_length: 512
        multiline: true
      - id: coverage-relationship
        type: choice
        prompt: Distinguish unchanged bytes, an ordinary Low-only delta and an eligible locally verified correction delta; neither delta is provider-reviewed.
        required: true
        choices:
          - same-as-review
          - review-predates-low-delta
          - review-predates-local-correction
      - id: low-disposition-verification
        type: check_result
        prompt: Record the caller-supplied result for aquarium-low-disposition-verification; Podway does not execute or attest the operation.
        help: Verify the frozen dispositions, exact delta and required local checks. The graph separately routes pending work, nonlocal blockers and current criterion or evidence gaps.
        required: true
        operation_id: aquarium-low-disposition-verification
        operation_digest: sha256:02a779d773de53df7007374215ed393c58b19ad7bbec80349622756e1736f6a5
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  low-result-decision:
    type: decision
    title: Evaluate Low verification
    objective: Continue only when the required local Low verification passed.
    prompt: Did the Low disposition verification pass on the current target?
    evidence_guidance:
      - Still-eligible failed checks retry settlement. Lost eligibility or nonlocal blockers use their existing rework owner; neither path grants another review.
    options:
      - id: passed
        label: Low verification passed
        criteria: The required local verification passed on the recorded final target.
        guards:
          - evidence:
              node: record-low-disposition
              item: low-disposition-verification
            field: outcome
            equals: pass
      - id: incomplete
        label: Low verification incomplete
        criteria: A required local check failed or is inconclusive, but the repair still qualifies for the current local envelope.
        guards:
          - evidence:
              node: record-low-disposition
              item: low-disposition-verification
            field: outcome
            not_equals: pass
          - evidence:
              node: record-low-disposition
              item: current-blocking-findings
            equals: 0
      - id: blocker-found
        label: Local eligibility lost
        criteria: Local verification is incomplete and an obligation requires ordinary authorized rework.
        guards:
          - evidence:
              node: record-low-disposition
              item: low-disposition-verification
            field: outcome
            not_equals: pass
          - evidence:
              node: record-low-disposition
              item: current-blocking-findings
            at_least: 1
    reason:
      required: true
      prompt: Explain the result using the exact local verification evidence.
  low-completion-decision:
    type: decision
    title: Verify local settlement
    objective: Advance after every frozen local disposition and current check is complete and the current corrected-target criterion assessment has no gap.
    prompt: Is the finite local settlement complete?
    evidence_guidance:
      - Preserve historical counts and rows; use current pending work, blockers and corrected-target criterion evidence.
      - Do not start another provider review solely for a verified local delta.
    options:
      - id: completed
        label: Low settlement completed
        criteria: Required local verification passed, pending Low dispositions, local corrections and current blockers are zero, and the current final-target completion assessment has no unmet or unverified criterion.
        guards:
          - evidence:
              node: record-low-disposition
              item: pending-low-dispositions
            equals: 0
          - evidence:
              node: record-low-disposition
              item: current-blocking-findings
            equals: 0
          - evidence:
              node: record-low-disposition
              item: completion-unmet-criteria
            equals: 0
          - evidence:
              node: record-low-disposition
              item: completion-unverified-criteria
            equals: 0
      - id: incomplete
        label: Low settlement incomplete
        criteria: A disposition or required local verification remains incomplete.
        guards:
          - evidence:
              node: record-low-disposition
              item: current-blocking-findings
            equals: 0
          - evidence:
              node: record-low-disposition
              item: pending-low-dispositions
            at_least: 1
      - id: blocker-found
        label: Current blocker found
        criteria: Local verification established a current blocker that must return to its owning phase within available authority.
        guards:
          - evidence:
              node: record-low-disposition
              item: current-blocking-findings
            at_least: 1
    reason:
      required: true
      prompt: Explain the result using the frozen set, local checks, and current target.
  goal-assessment-core-decision:
    type: decision
    title: Confirm core task evidence for goal assessment
    objective: Carry the approved plan, current implementation, verification, refinement, and documentation through one bounded gate before goal assessment.
    prompt: Is the core task evidence ready for goal assessment?
    evidence_guidance:
      - Read the approved plan, latest implementation revision, passing verification, refinement, and documentation evidence.
      - Preserve their current relationship in the decision reason; this gate does not itself assess the session goal.
      - Compose the reviewed basis, verified local delta, after-target and current criteria. The review predates changed bytes; this delta alone needs no phase rerun or new ordinal.
    options:
      - id: ready
        label: Core task evidence ready
        criteria: The selected current task evidence is coherent and verification passed.
        guards:
          - evidence:
              node: verify
              item: verification-result
            field: outcome
            equals: pass
      - id: not-ready
        label: Core evidence is not ready
        criteria: Current verification is failed or inconclusive; an advancing path must return to verification while a stopped path remains non-achieved.
        guards:
          - evidence:
              node: verify
              item: verification-result
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Explain how the selected core evidence is current and ready for goal assessment.
  goal-assessment:
    type: decision
    title: Assess the task goal
    objective: Determine the current roadmap task goal from fresh evidence.
    prompt: What is the outcome of the current task goal?
    evidence_guidance:
      - Read the approved plan, latest implementation, verification, documentation, and review evidence.
      - A path reached after either user stop choice cannot select achieved; use the carried direction, route-stop classification, and completion evidence when assessing every criterion.
    options:
      - id: achieved
        label: Goal achieved
        criteria: Fresh criterion assessments support the current goal revision.
        guards:
          - evidence:
              node: evaluator-task
              item: evaluator-goal-outcome
            equals: achieved
          - evidence:
              node: evaluator-task
              item: evaluator-verdict
            equals: pass
          - evidence:
              node: evaluator-task
              item: evaluator-unmet-criteria
            equals: 0
          - evidence:
              node: evaluator-task
              item: evaluator-unverified-criteria
            equals: 0
      - id: not-achieved
        label: Goal not achieved
        criteria: Fresh evidence does not support the current goal revision.
        guards:
          - evidence:
              node: evaluator-task
              item: evaluator-goal-outcome
            equals: not-achieved
      - id: superseded
        label: Goal superseded
        criteria: The current goal revision is no longer the desired outcome.
        guards:
          - evidence:
              node: evaluator-task
              item: evaluator-goal-outcome
            equals: superseded
    reason:
      required: true
      prompt: Explain the outcome using criterion assessments and evidence.
    assessment:
      target: session_goal
      outcomes:
        achieved: achieved
        not-achieved: not_achieved
        superseded: superseded
  stopped-goal-assessment:
    type: decision
    title: Assess the stopped task goal
    objective: Determine the current roadmap task goal without permitting an achieved outcome after an explicit stop.
    prompt: What non-achieved outcome applies to the stopped task goal?
    evidence_guidance:
      - Read the confirmed stopped boundary, carried direction or route-stop evidence, and current completion evidence.
      - This path cannot select achieved; assess whether the goal is not achieved or superseded.
    options:
      - id: invalid-not-stopped
        label: Invalid non-stopped boundary
        criteria: This option is structurally required by goal tracking but is unavailable after the stopped-boundary confirmation.
        guards:
          - evidence:
              node: record-stopped-goal-boundary
              item: goal-outcome-boundary
            equals: invalid-not-stopped
      - id: stopped
        label: Goal stopped without achievement
        criteria: The explicit stop leaves the current goal revision unachieved.
        guards:
          - evidence:
              node: evaluator-stopped-task
              item: evaluator-goal-outcome
            equals: stopped
      - id: not-achieved
        label: Goal not achieved
        criteria: Fresh evidence does not support the current goal revision.
        guards:
          - evidence:
              node: evaluator-stopped-task
              item: evaluator-goal-outcome
            equals: not-achieved
      - id: superseded
        label: Goal superseded
        criteria: The current goal revision is no longer the desired outcome.
        guards:
          - evidence:
              node: evaluator-stopped-task
              item: evaluator-goal-outcome
            equals: superseded
    reason:
      required: true
      prompt: Explain the non-achieved outcome using the stopped boundary, criterion assessments, and carried stop evidence.
    assessment:
      target: session_goal
      outcomes:
        invalid-not-stopped: achieved
        stopped: not_achieved
        not-achieved: not_achieved
        superseded: superseded
  stopped-goal-boundary-record:
    type: action
    title: Record the stopped goal boundary
    intent: Carry an explicit user or review-route stop into goal assessment without permitting an achieved outcome.
    instructions:
      - Record the single path-owned outcome boundary after reading the carried stop evidence.
      - Do not reinterpret a stop as task completion or create new remediation authority.
    items:
      - id: goal-outcome-boundary
        type: choice
        prompt: Record the only goal outcome boundary admitted after an explicit stop.
        required: true
        choices:
          - stopped
          - invalid-not-stopped
  stopped-core-gap-record:
    type: action
    title: Record the stopped core evidence gap
    intent: Preserve failed or inconclusive verification as non-achievement evidence without reopening work after an explicit stop.
    instructions:
      - Record the current verification gap and carried stop authority.
      - Do not reinterpret the stop as remediation authority or a successful outcome.
    items:
      - id: stopped-core-gap-summary
        type: text
        prompt: Record the failed or inconclusive verification evidence that remains under the explicit stop.
        required: true
        min_length: 1
        max_length: 2000
        multiline: true
  stopped-goal-boundary-decision:
    type: decision
    title: Confirm the stopped goal boundary
    objective: Admit goal assessment only through the path-owned stopped boundary.
    prompt: Does the recorded boundary preserve the explicit stop?
    options:
      - id: confirmed
        label: Stopped boundary confirmed
        criteria: The path record permits only not-achieved or superseded goal outcomes.
        guards:
          - evidence:
              node: record-stopped-goal-boundary
              item: goal-outcome-boundary
            equals: stopped
      - id: invalid
        label: Restore the stopped boundary
        criteria: The boundary does not preserve the explicit stop and must be recorded again before assessment.
        guards:
          - evidence:
              node: record-stopped-goal-boundary
              item: goal-outcome-boundary
            equals: invalid-not-stopped
    reason:
      required: true
      prompt: Explain how the explicit stop remains binding for goal assessment.
  outcome-record:
    type: action
    title: Record the assessed outcome
    intent: Record the outcome and any required follow-up before approval.
    instructions:
      - Preserve the actual assessment and remaining commitments; a terminal Procedure path does not imply roadmap success.
    items:
      - id: outcome-summary
        type: text
        prompt: Record the assessed outcome and follow-up commitments.
        required: true
        min_length: 1
        max_length: 3000
        multiline: true
  approval-decision:
    type: decision
    title: Record final user approval
    objective: Close only with the task-close confirmations required by repository authority; a rejection whose correction changes behavior must reach implementation through manual rework.
    prompt: Did the user accept tests, documentation, and the exact final implementation?
    evidence_guidance:
      - Read the assessed outcome and the exact final diff presented to the user.
    options:
      - id: approved
        label: Final approval granted
        criteria: Every applicable task-close confirmation is affirmative.
      - id: changes-requested
        label: Changes requested
        criteria: A confirmation is explicitly negative, requests a correction, or names a specific unmet gate.
    reason:
      required: true
      prompt: Record the user's decision and the approved authority boundary.
  closeout-record:
    type: action
    title: Record task closeout
    intent: Record final roadmap, commit, worktree, and publication states.
    instructions:
      - Use task-close and, only with separate commit authority, task-commit on the exact accepted final-target composition.
      - Reject stale or extra changes and do not invoke review, push, publish, install, or reset a session by implication.
    items:
      - id: closeout-summary
        type: text
        prompt: Record terminal roadmap state, commit if any, worktree state, and publication state.
        required: true
        min_length: 1
        max_length: 3000
        multiline: true
      - id: promoted-evidence-references
        type: list
        prompt: Record each committed aquarium.promoted-evidence/v1 or v2 manifest as its repository-relative path followed by exactly one sha256-prefixed 64-hex manifest digest; leave absent when no package applies.
        required: false
