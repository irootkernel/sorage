        prompt: Verify actual applicable unconsumed authority for the exact correction or evidence operation and its owner; a negative Evaluator verdict is not authority.
        required: true
        operation_id: aquarium-task-semantic-followup-authority
        operation_digest: sha256:34ad514b6b87476f0b7d1d66d468e68d3c78b061778f9d3b627681565aa7d9ff
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  semantic-documentation-followup-authority:
    type: decision
    title: Confirm semantic followup authority
    objective: Block uncovered corrections and evidence operations.
    prompt: Is the exact followup operation already authorized?
    options:
      - id: authorized
        label: Followup authorized
        criteria: The exact current operation is covered by existing authority.
        guards:
          - evidence:
              node: record-documentation-followup
              item: semantic-authority
            field: outcome
            equals: pass
      - id: blocked
        label: Authority missing
        criteria: The effect is uncovered or uncertain; await actual bounded authority.
        guards:
          - evidence:
              node: record-documentation-followup
              item: semantic-authority
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Record the exact authority and consumption basis or blocker.
  semantic-documentation-followup-authority-evidence:
    type: decision
    title: Confirm semantic followup authority
    objective: Block uncovered corrections and evidence operations.
    prompt: Is the exact followup operation already authorized?
    options:
      - id: authorized
        label: Followup authorized
        criteria: The exact current operation is covered by existing authority.
        guards:
          - evidence:
              node: record-documentation-evidence
              item: semantic-authority
            field: outcome
            equals: pass
      - id: blocked
        label: Authority missing
        criteria: The effect is uncovered or uncertain; await actual bounded authority.
        guards:
          - evidence:
              node: record-documentation-evidence
              item: semantic-authority
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Record the exact authority and consumption basis or blocker.
  semantic-review-followup:
    type: action
    title: Record review followup basis
    intent: Bind the actual correction or evidence owner to remaining authority without creating another review or effect.
    instructions:
      - Read the triggering Evaluator report or current settlement criterion gap and exact target. Record its actual evidence owner without changing original source assessments.
      - A negative verdict supplies no authority. Require actual applicable unconsumed correction/check/provider authority before admitting the specific effect. Otherwise stop here or at the blocked decision until actual authority arrives.
      - Review evidence collection must reconcile the selected operation before a new dispatch; never start another provider or reset an ordinal to answer a semantic gap.
      - This placement returns only to prepare-review. For a different earlier owner, stop and use its explicitly authorized manual rework target; do not route forward or broaden effects.
    items:
      - id: semantic-followup-summary
        type: text
        prompt: Record source node/attempt/report, exact target, required work or evidence, original criterion IDs, finding lineage, consumed ordinals, remaining authority and exclusions.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: semantic-owner
        type: choice
        prompt: Record the earliest actual owner.
        required: true
        choices:
          - prepare-review
      - id: semantic-authority
        type: check_result
        prompt: Verify actual applicable unconsumed authority for the exact correction or evidence operation and its owner; a negative Evaluator verdict is not authority.
        required: true
        operation_id: aquarium-task-semantic-followup-authority
        operation_digest: sha256:34ad514b6b87476f0b7d1d66d468e68d3c78b061778f9d3b627681565aa7d9ff
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
  semantic-review-followup-authority-evidence:
    type: decision
    title: Confirm semantic followup authority
    objective: Block uncovered corrections and evidence operations.
    prompt: Is the exact followup operation already authorized?
    options:
      - id: authorized
        label: Followup authorized
        criteria: The exact current operation is covered by existing authority.
        guards:
          - evidence:
              node: record-review-evidence
              item: semantic-authority
            field: outcome
            equals: pass
      - id: blocked
        label: Authority missing
        criteria: The effect is uncovered or uncertain; await actual bounded authority.
        guards:
          - evidence:
              node: record-review-evidence
              item: semantic-authority
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Record the exact authority and consumption basis or blocker.
  local-correction-handling-decision:
    type: decision
    title: Classify local correction
    objective: Use direct verified settlement for eligible corrections before requesting another provider assessment.
    prompt: Can the current correction set be settled locally under existing authority?
    evidence_guidance:
      - Preserve source severity, negative criterion rows and the consumed ordinal. Eligibility covers every current blocker; new judgment, missing reviewer coverage or uncovered effects use ordinary routing.
      - Reconcile provisional eligibility with the latest Evaluator report. A new nonlocal obligation requires ordinary routing even after a source pass; preserve the source record.
    options:
      - id: local
        label: Settle locally
        criteria: All blocking obligations are covered by the admitted local correction set and its direct verification plan within current effect authority.
        guards:
          - evidence:
              node: review
              item: local-correction-count
            at_least: 1
          - evidence:
              node: review
              item: local-correction-eligibility
            field: outcome
            equals: pass
      - id: ordinary
        label: Keep ordinary rework or evidence routing
        criteria: The latest Evaluator or current evidence establishes a nonlocal or unproven obligation, including one discovered after a provisional passing eligibility record.
        guards:
          - evidence:
              node: review
              item: local-correction-count
            at_least: 1
    reason:
      required: true
      prompt: Name source findings, target, affected criterion rows, required checks and effect authority, or the exact reason local settlement is unavailable.
  local-correction-completion-decision:
    type: decision
    title: Confirm local corrections are settled
    objective: Admit ordinary Low completion only after every local correction is verified.
    prompt: Are any admitted local corrections still pending?
    options:
      - id: settled
        label: Local corrections settled
        criteria: No local correction remains pending; ordinary Low and current completion checks follow separately.
        guards:
          - evidence:
              node: record-low-disposition
              item: pending-local-corrections
            equals: 0
      - id: pending
        label: Local corrections pending
        criteria: At least one admitted local correction still needs repair or direct verification.
        guards:
          - evidence:
              node: record-low-disposition
              item: pending-local-corrections
            at_least: 1
    reason:
      required: true
      prompt: Name the completed correction evidence or the exact remaining work; this decision creates no review authority.
  local-correction-candidate-decision:
    type: decision
    title: Check local correction candidates
    objective: Keep ordinary routing when no local correction candidate exists; otherwise inspect its eligibility separately.
    prompt: Does the admitted review identify any local correction candidate?
    options:
      - id: none
        label: No local candidates
        criteria: The source candidate count is zero.
        guards:
          - evidence:
              node: review
              item: local-correction-count
            equals: 0
      - id: candidate
        label: Check candidate eligibility
        criteria: At least one source candidate needs its separate scope, coverage and authority eligibility check.
        guards:
          - evidence:
              node: review
              item: local-correction-count
            at_least: 1
    reason:
      required: true
      prompt: Identify the finite source correction set or its explicit absence; this count grants no effect or review authority.
  local-current-completion-decision:
    type: decision
    title: Route current settlement criteria
    objective: Preserve current unmet and unverified criterion ownership without accepting a gap or looping completed dispositions.
    prompt: What does the current corrected-target criterion assessment establish?
    evidence_guidance:
      - Use current settlement rows while retaining the original review rows and exact authorized delta.
    options:
      - id: complete
        label: Current criteria satisfied
        criteria: Every current applicable criterion is supported.
        guards:
          - evidence:
              node: record-low-disposition
              item: completion-unmet-criteria
            equals: 0
          - evidence:
              node: record-low-disposition
              item: completion-unverified-criteria
            equals: 0
      - id: unmet
        label: Current correction needed
        criteria: At least one current criterion remains unmet.
        guards:
          - evidence:
              node: record-low-disposition
              item: completion-unmet-criteria
            at_least: 1
      - id: unverified
        label: Current evidence needed
        criteria: No criterion is unmet but required criterion evidence is unverified.
        guards:
          - evidence:
              node: record-low-disposition
              item: completion-unmet-criteria
            equals: 0
          - evidence:
              node: record-low-disposition
              item: completion-unverified-criteria
            at_least: 1
    reason:
      required: true
      prompt: Name the current criterion, exact proof or gap and its existing owner.
  local-finding-consistency-decision:
    type: decision
    title: Reconcile source finding counts
    objective: Retain the existing finding-count consistency prerequisite on every local candidate path.
    prompt: Are the completed source review finding counts internally consistent?
    evidence_guidance:
      - Repair inconsistent adjudication from the same source review; this does not itself require another provider operation.
    options:
      - id: consistent
        label: Source counts consistent
        criteria: The source count relationship is supported.
        guards:
          - evidence:
              node: review
              item: finding-count-consistency
            equals: consistent
      - id: inconsistent
        label: Source adjudication needs repair
        criteria: The source finding-count relationship is unproven or inconsistent.
        guards:
          - evidence:
              node: review
              item: finding-count-consistency
            not_equals: consistent
    reason:
      required: true
      prompt: Record the source counts and supported relationship or exact same-operation correction.
  new-live-review-admission-decision:
    type: decision
    title: Admit one fresh Mulgae root
    objective: Separate explicit new execution from pending invocation resume and retired source replay.
    prompt: Does explicit authority admit a fresh current-source review after terminal settlement?
    options:
      - id: start
        label: Prepare the newly authorized root
        criteria: Explicit user intent covers one fresh current-source root and all selected roles, with prior findings and the pending ordinal preserved; refresh the Brief, source preflight and affected verification before execution.
        guards:
          - evidence:
              node: prepare-review
              item: prior-review-route
            equals: mulgae
          - evidence:
              node: prepare-review
              item: effective-review-route
            equals: mulgae
          - evidence:
              node: prepare-review
              item: prior-route-lifecycle-state
            equals: terminal-incomplete-or-failed
          - evidence:
              node: prepare-review
              item: prior-route-change-readiness
            equals: safe-to-change
      - id: reprepare
        label: Reprepare without starting another review
        criteria: Current source, explicit authority or terminal settlement is not established; preserve the prior operation and evidence.
    reason:
      required: true
      prompt: Bind the user's exact new-execution authority, current source and retained pending ordinal, or explain the stopped boundary.
  changed-review-continuity-decision:
    type: decision
    title: Verify explicit route-change continuity
    objective: Require the recorded continuity result before classifying an explicit route change or waiver.
    prompt: Did the route-change continuity check pass?
    options:
      - id: pass
        label: Classify the admitted change
        criteria: The recorded direction, authority and prior operation have passing continuity.
        guards:
          - evidence:
              node: prepare-review
              item: route-direction-continuity
            field: outcome
            equals: pass
      - id: reprepare
        label: Reprepare the checkpoint
        criteria: Continuity failed or remains unverified.
    reason:
      required: true
      prompt: Preserve the exact continuity result and remaining authority.
graph:
  entry: record-plan
  nodes:
    - id: record-plan
      use: plan-record
      next: evaluator-plan
    - id: evaluator-plan
      use: evaluator-assessment-record
      evidence_from:
        - node: record-plan
          required: true
          items:
            - plan-summary
            - review-route
            - review-target-scope
            - review-selection-summary
            - plan-handoff-artifact
            - executor-handoff
      next: decide-plan-assessment
    - id: decide-plan-assessment
      use: semantic-plan-decision
      evidence_from:
        - node: evaluator-plan
          required: true
          items:
            - evaluator-assessment
            - evaluator-verdict
            - evaluator-unmet-criteria
            - evaluator-unverified-criteria
            - evaluator-applicability
            - evaluator-summary
            - evaluator-checkpoint-result
      routes:
        passed:
          to: prepare-implementation
          effect: advance
        inapplicable:
          to: evaluator-plan
          effect: rework
        rework:
          to: record-plan-followup
          effect: advance
        evidence-needed:
          to: record-plan-evidence
          effect: advance
    - id: prepare-implementation
      use: implementation-entry-record
      evidence_from:
        - node: record-plan
          required: true
          items:
            - plan-summary
        - node: record-plan
          required: false
          items:
            - plan-handoff-artifact
      next: implement
    - id: implement
      use: implementation-record
      evidence_from:
        - node: record-plan
          required: true
          items:
            - plan-summary
        - node: prepare-implementation
          required: true
          items:
            - implementation-entry-summary
        - node: record-plan
          required: false
          items:
            - plan-handoff-artifact
      next: refine
    - id: refine
      use: refinement-record
      evidence_from:
        - node: implement
          required: true
          items:
            - implementation-summary
            - source-revision
      next: verify
    - id: verify
      use: verification-record
      evidence_from:
        - node: refine
          required: true
          items:
            - refinement-summary
      next: evaluator-verification
    - id: evaluator-verification
      use: evaluator-assessment-record
      evidence_from:
        - node: verify
          required: true
          items:
            - verification-result
            - verification-observations
            - executor-handoff
        - node: refine
          required: true
          items:
            - refinement-summary
            - executor-handoff
        - node: record-plan
          required: true
          items:
            - plan-summary
        - node: implement
          required: true
          items:
            - implementation-summary
            - source-revision
            - executor-handoff
      next: confirm-verification-operation
    - id: confirm-verification-operation
      use: verification-operation-decision
      evidence_from:
        - node: verify
          required: true
          items:
            - verification-result
            - verification-observations
      routes:
        check-passed:
          to: decide-verification
          effect: advance
        check-failed:
          to: verify
          effect: rework
    - id: decide-verification
      use: semantic-verification-decision
      evidence_from:
        - node: evaluator-verification
          required: true
          items:
            - evaluator-assessment
            - evaluator-verdict
            - evaluator-unmet-criteria
            - evaluator-unverified-criteria
            - evaluator-applicability
            - evaluator-summary
            - evaluator-checkpoint-result
      routes:
        passed:
          to: document
          effect: advance
        inapplicable:
          to: evaluator-verification
          effect: rework
        rework:
          to: record-verification-followup
          effect: advance
        evidence-needed:
          to: record-verification-evidence
          effect: advance
    - id: document
      use: documentation-record
      evidence_from:
        - node: implement
          required: true
          items:
            - implementation-summary
            - source-revision
        - node: refine
          required: true
          items:
            - refinement-summary
        - node: verify
          required: true
          items:
            - verification-result
            - verification-observations
        - node: decide-verification
          required: true
      next: evaluator-documentation
    - id: evaluator-documentation
      use: evaluator-assessment-record
      evidence_from:
        - node: document
          required: true
          items:
            - documentation-summary
            - executor-handoff
        - node: implement
          required: true
          items:
            - implementation-summary
            - source-revision
        - node: refine
          required: true
          items:
            - refinement-summary
        - node: verify
          required: true
          items:
            - verification-result
            - verification-observations
        - node: decide-verification
          required: true
      next: decide-documentation-assessment
    - id: decide-documentation-assessment
