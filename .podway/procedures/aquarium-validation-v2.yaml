          to: prepare-validation-pass
          effect: rework
        stop:
          to: record-stopped
          effect: advance
    - id: record-audit-low-basis
      use: audit-low-basis-record
      evidence_from:
        - node: audit
          required: false
          items:
            - audit-result
            - audit-summary
            - confirmed-gap-count
            - blocking-gap-count
            - eligible-low-gap-count
            - confirmation-needed-gap-count
        - node: re-audit
          required: false
          items:
            - audit-result
            - audit-summary
            - confirmed-gap-count
            - blocking-gap-count
            - eligible-low-gap-count
            - confirmation-needed-gap-count
      next: record-current-audit-basis
    - id: record-current-audit-basis
      use: current-audit-basis-record
      evidence_from:
        - node: audit
          required: false
          items:
            - audit-result
            - audit-summary
            - blocking-gap-count
            - eligible-low-gap-count
            - confirmation-needed-gap-count
        - node: re-audit
          required: false
          items:
            - audit-result
            - audit-summary
            - blocking-gap-count
            - eligible-low-gap-count
            - confirmation-needed-gap-count
        - node: record-audit-low-basis
          required: false
          items:
            - audit-basis-target
            - audit-basis-status
            - audit-low-basis-summary
      next: final-review
    - id: final-review
      use: final-review-record
      evidence_from:
        - node: record-current-audit-basis
          required: true
          items:
            - current-audit-basis-summary
        - node: audit
