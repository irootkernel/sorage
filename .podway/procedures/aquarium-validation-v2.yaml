      - id: judge-verdict
        type: choice
        prompt: Record the Judge verdict.
        required: true
        choices:
          - pass
          - rework
          - evidence-needed
      - id: judge-unmet-criteria
        type: integer
        prompt: Count mandatory unmet criteria, including omitted original criteria.
        required: true
        minimum: 0
      - id: judge-unverified-criteria
        type: integer
        prompt: Count mandatory unverified criteria, including incomplete compound criteria.
        required: true
        minimum: 0
      - id: judge-applicability
        type: check_result
        prompt: Record the caller-supplied result for aquarium-validation-judge-applicability against its complete declared operation. Podway does not execute or attest this check.
