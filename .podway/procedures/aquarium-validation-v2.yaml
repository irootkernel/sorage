        criteria: The exact current effect is already covered by actual authority.
        guards:
          - evidence:
              node: record-validation-rework-basis
              item: semantic-authority
            field: outcome
            equals: pass
      - id: blocked
        label: Authority missing
        criteria: Await actual bounded authority without implementation or redispatch.
        guards:
          - evidence:
              node: record-validation-rework-basis
              item: semantic-authority
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Record exact current evidence, source attempt and target, remaining authority and the next owner.
  stopped-core-gap-record:
    type: action
    title: Record stopped core evidence gaps
    intent: Preserve the core evidence repair request within the confirmed stopped boundary.
    instructions:
      - Record the missing, stale or incoherent evidence identified by the core Decision and include this record in the stopped final Worker assignment.
      - Reconcile only available evidence; preserve unresolved gaps and the stopped boundary without implementation, provider review or renewed acceptance.
    items:
      - id: stopped-core-gaps
        type: text
        prompt: Record the evidence gaps and bounded reconciliation needed for stopped final assembly.
        required: true
        min_length: 1
        max_length: 3000
        multiline: true
  validation-assessment-candidate:
    type: action
    title: Assemble the final validation candidate
    intent: Assemble the final validation candidate
    instructions:
      - Read complete canonical original criteria and evidence directly. Passing member labels, inherited verdicts, zero provider findings or a Worker-only summary cannot establish Epic achievement.
      - Compose every applicable selected audit, provider and Judge report, verified group commit, local reviewed-basis/permitted-delta/after-target composition and current checks without starting implementation or a provider.
      - Cold epic-validator has a fresh Judge with direct source access; internal epic-handler retains its existing logical Epic Judge and full lifetime and history.
      - For stopped assembly require the baseline and exact current stopped boundary. Include every available audit, re-audit, correction, Low, provider/Judge and disposition record, including confirmation-incomplete, review-operation-incomplete and actual direction or route-stop evidence; legitimately bypassed phases stay optional. Supply original full artifacts and stopped-core-gaps in the complete assignment beyond bounded selectors.
      - After a confirmed stopped boundary, reconcile only available evidence, preserve unresolved gaps and retain a fresh stopped Worker and Judge. No ordinary work, provider admission, achievement or renewed acceptance is authorized.
    items:
      - id: validation-assessment-summary
        type: text
        prompt: Record complete original Epic criteria and direct artifacts, every member and integration seam, exact final target, actual audit and provider outcomes, confirmed gaps, verified groups, local composition, authority and supported outcome.
        required: true
        min_length: 1
        max_length: 8000
        multiline: true
      - id: worker-handoff
        type: artifact
        prompt: Reference the complete aquarium.worker-handoff/v1 candidate, exact target, requirement basis, checks, authority, gaps and authentic native result bindings.
        required: true
        allowed_media_types:
          - application/json
  confirm-judge-validation-applicability:
    type: decision
    title: Confirm current final validation applicability
    objective: Confirm current final validation applicability
    prompt: Confirm current final validation applicability?
    options:
      - id: current
        label: Report current
        criteria: Complete original coverage, direct artifacts and exact target and native bindings are applicable.
        guards:
          - evidence:
              node: judge-validation
              item: judge-applicability
            field: outcome
            equals: pass
      - id: invalid
        label: Report inapplicable
        criteria: Reassess the fresh original artifacts without relaxing the requirement.
        guards:
          - evidence:
              node: judge-validation
              item: judge-applicability
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Record exact current evidence, source attempt and target, remaining authority and the next owner.
  confirm-judge-stopped-validation-applicability:
    type: decision
    title: Confirm current final validation applicability
    objective: Confirm current final validation applicability
    prompt: Confirm current final validation applicability?
    options:
      - id: current
        label: Report current
        criteria: Complete original coverage, direct artifacts and exact target and native bindings are applicable.
        guards:
          - evidence:
              node: judge-stopped-validation
              item: judge-applicability
            field: outcome
            equals: pass
      - id: invalid
        label: Report inapplicable
        criteria: Reassess the fresh original artifacts without relaxing the requirement.
        guards:
          - evidence:
              node: judge-stopped-validation
              item: judge-applicability
            field: outcome
            not_equals: pass
    reason:
      required: true
      prompt: Record exact current evidence, source attempt and target, remaining authority and the next owner.
  local-correction-handling-decision:
    type: decision
    title: Classify local correction
    objective: Use direct verified settlement for eligible corrections before requesting another provider assessment.
    prompt: Can the current correction set be settled locally under existing authority?
    evidence_guidance:
      - Preserve source severity, negative criterion rows and the consumed ordinal. Eligibility covers every current blocker; new judgment, missing reviewer coverage or uncovered effects use ordinary routing.
      - Reconcile provisional eligibility with the latest Judge report. A new nonlocal obligation requires ordinary routing even after a source pass; preserve the source record.
    options:
      - id: local
        label: Settle locally
        criteria: All blocking obligations are covered by the admitted local correction set and its direct verification plan within current effect authority.
        guards:
          - evidence:
              node: final-review
              item: local-correction-count
            at_least: 1
          - evidence:
              node: final-review
              item: local-correction-eligibility
            field: outcome
            equals: pass
      - id: ordinary
        label: Keep ordinary rework or evidence routing
        criteria: The latest Judge or current evidence establishes a nonlocal or unproven obligation, including one discovered after a provisional passing eligibility record.
        guards:
          - evidence:
              node: final-review
              item: local-correction-count
            at_least: 1
    reason:
      required: true
      prompt: Name source findings, target, affected criterion rows, required checks and effect authority, or the exact reason local settlement is unavailable.
  local-correction-completion-decision:
    type: decision
    title: Confirm local corrections are settled
    objective: Admit ordinary Low completion only after every local correction is verified.
    prompt: Are any admitted local corrections still pending?
    options:
      - id: settled
        label: Local corrections settled
        criteria: No local correction remains pending; ordinary Low and current completion checks follow separately.
        guards:
          - evidence:
              node: record-low-disposition
              item: pending-local-corrections
            equals: 0
      - id: pending
        label: Local corrections pending
        criteria: At least one admitted local correction still needs repair or direct verification.
        guards:
          - evidence:
              node: record-low-disposition
              item: pending-local-corrections
            at_least: 1
    reason:
      required: true
      prompt: Name the completed correction evidence or the exact remaining work; this decision creates no review authority.
  local-correction-candidate-decision:
    type: decision
    title: Check local correction candidates
    objective: Keep ordinary routing when no local correction candidate exists; otherwise inspect its eligibility separately.
    prompt: Does the admitted review identify any local correction candidate?
    options:
      - id: none
        label: No local candidates
        criteria: The source candidate count is zero.
        guards:
          - evidence:
              node: final-review
              item: local-correction-count
            equals: 0
      - id: candidate
        label: Check candidate eligibility
        criteria: At least one source candidate needs its separate scope, coverage and authority eligibility check.
        guards:
          - evidence:
              node: final-review
              item: local-correction-count
            at_least: 1
    reason:
      required: true
      prompt: Identify the finite source correction set or its explicit absence; this count grants no effect or review authority.
  local-current-completion-decision:
    type: decision
    title: Route current settlement criteria
    objective: Preserve current unmet and unverified criterion ownership without accepting a gap or looping completed dispositions.
    prompt: What does the current corrected-target criterion assessment establish?
    evidence_guidance:
      - Use current settlement rows while retaining the original review rows and exact authorized delta.
    options:
      - id: complete
        label: Current criteria satisfied
        criteria: Every current applicable criterion is supported.
        guards:
          - evidence:
              node: record-low-disposition
              item: completion-unmet-criteria
            equals: 0
          - evidence:
              node: record-low-disposition
              item: completion-unverified-criteria
            equals: 0
      - id: unmet
        label: Current correction needed
        criteria: At least one current criterion remains unmet.
        guards:
          - evidence:
              node: record-low-disposition
              item: completion-unmet-criteria
            at_least: 1
      - id: unverified
        label: Current evidence needed
        criteria: No criterion is unmet but required criterion evidence is unverified.
        guards:
          - evidence:
              node: record-low-disposition
              item: completion-unmet-criteria
            equals: 0
          - evidence:
              node: record-low-disposition
              item: completion-unverified-criteria
            at_least: 1
    reason:
      required: true
      prompt: Name the current criterion, exact proof or gap and its existing owner.
  local-required-evidence-decision:
    type: decision
    title: Check current mandatory evidence
    objective: Preserve the mandatory Validation evidence veto on every local settlement path.
    prompt: Does the corrected target retain every mandatory evidence prerequisite?
    evidence_guidance:
      - Use the current mandatory evidence count and its proof references, not a rewritten historical source count.
    options:
      - id: complete
        label: Current required evidence complete
        criteria: No current mandatory evidence gap remains.
        guards:
          - evidence:
              node: record-low-disposition
              item: current-required-evidence-gaps
            equals: 0
      - id: incomplete
        label: Mandatory evidence missing
        criteria: A current required prerequisite or audit basis is missing.
        guards:
          - evidence:
              node: record-low-disposition
              item: current-required-evidence-gaps
            at_least: 1
    reason:
      required: true
      prompt: Name the current evidence basis or missing prerequisite.
graph:
  entry: capture-baseline
  nodes:
    - id: capture-baseline
      use: baseline-record
      next: prepare-validation-pass
    - id: prepare-validation-pass
      use: validation-pass-record
      next: decide-validation-pass
    - id: decide-validation-pass
      use: validation-pass-decision
      evidence_from:
        - node: prepare-validation-pass
          required: true
          items:
            - pass-kind
            - pass-basis-summary
      routes:
        initial-audit:
          to: audit
          effect: advance
        remediation:
          to: remediate
          effect: advance
    - id: audit
      use: audit-record
      evidence_from:
        - node: prepare-validation-pass
          required: true
          items:
            - pass-kind
            - pass-basis-summary
        - node: settle-remediation-group
          required: false
          items:
            - remediation-summary
            - completed-review-assessments
            - remediation-authority
      delegation:
        binding_ref: aquarium-native
        role_ref: aquarium-worker/v1
        role_snapshot_digest: sha256:7544cae7f4becb8fcf0d119e8ac0aa9815bd29d7c96cfa1761b2e00acd69e53e
        max_rounds: 32
        after_accept: retain
      next: judge-audit
    - id: decide-gaps
      use: gap-decision
      evidence_from:
        - node: audit
          required: true
          items:
            - audit-result
            - audit-summary
            - confirmed-gap-count
            - blocking-gap-count
            - eligible-low-gap-count
            - confirmation-needed-gap-count
            - blocking-rework-authority
      routes:
        clean:
          to: record-current-audit-basis
          effect: advance
        blocking-gaps:
          to: prepare-validation-pass
          effect: rework
        low-only:
          to: record-audit-low-basis
          effect: advance
        confirmation-required:
          to: record-confirmation-incomplete
          effect: advance
        user-direction:
          to: await-audit-direction
          effect: advance
        incomplete:
          to: record-incomplete
          effect: advance
    - id: remediate
      use: remediation-record
      evidence_from:
        - node: prepare-validation-pass
          required: true
          items:
            - pass-kind
            - pass-basis-summary
      delegation:
        binding_ref: aquarium-native
        role_ref: aquarium-worker/v1
        role_snapshot_digest: sha256:7544cae7f4becb8fcf0d119e8ac0aa9815bd29d7c96cfa1761b2e00acd69e53e
        max_rounds: 32
        after_accept: retain
      next: judge-remediation
    - id: decide-remediation-audit-authority
      use: remediation-audit-authority-decision
      evidence_from:
        - node: settle-remediation-group
          required: true
          items:
            - remediation-summary
            - remediation-authority
      routes:
        current-envelope:
          to: decide-remediation-audit-scope
          effect: advance
        one-shot:
          to: re-audit
          effect: advance
    - id: decide-remediation-audit-scope
      use: remediation-audit-scope-decision
      evidence_from:
        - node: settle-remediation-group
          required: true
          items:
            - remediation-summary
            - completed-review-assessments
            - remediation-authority
      routes:
        full:
          to: audit
          effect: advance
        frozen:
          to: re-audit
          effect: advance
    - id: re-audit
      use: remediation-confirmation-audit-record
      evidence_from:
        - node: settle-remediation-group
          required: true
          items:
            - remediation-summary
            - completed-review-assessments
            - remediation-authority
      delegation:
        binding_ref: aquarium-native
        role_ref: aquarium-worker/v1
        role_snapshot_digest: sha256:7544cae7f4becb8fcf0d119e8ac0aa9815bd29d7c96cfa1761b2e00acd69e53e
        max_rounds: 32
        after_accept: retain
      next: judge-re-audit
    - id: decide-re-audit
      use: re-audit-decision
      evidence_from:
        - node: re-audit
          required: true
          items:
            - audit-result
            - audit-summary
            - confirmed-gap-count
            - blocking-gap-count
            - eligible-low-gap-count
            - confirmation-needed-gap-count
            - direction-required-gap-count
            - blocking-rework-authority
      routes:
        clean:
          to: record-current-audit-basis
          effect: advance
        user-direction:
          to: await-audit-direction
          effect: advance
        low-only:
          to: record-audit-low-basis
          effect: advance
        incomplete:
          to: record-incomplete
          effect: advance
    - id: await-audit-direction
      use: user-direction-record
      evidence_from:
        - node: audit
          required: false
          items:
            - audit-summary
            - blocking-gap-count
            - blocking-rework-authority
        - node: re-audit
          required: false
          items:
            - audit-summary
            - blocking-gap-count
            - direction-required-gap-count
            - blocking-rework-authority
      next: choose-audit-direction
