    title: Bind the current audit basis
    intent: Carry the one fresh full or frozen audit into the independently required final review.
    instructions:
      - Read the resolved current audit or re-audit result and complete summary after its serial gap decision. Bind its exact attempt, target, scope and applicable obligations; do not select a stale audit from before correction.
      - Preserve any applicable audit Low basis under its own namespace. This action neither executes a review nor consumes an assessment.
    items:
      - id: current-audit-basis-summary
        type: text
        prompt: Record the exact fresh audit attempt and result, current target, full or frozen scope, applicable findings and criterion evidence.
