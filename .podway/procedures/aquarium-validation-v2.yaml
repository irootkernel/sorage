            - audit-low-basis-summary
      delegation:
        binding_ref: aquarium-native
        role_ref: aquarium-worker/v1
        role_snapshot_digest: sha256:7544cae7f4becb8fcf0d119e8ac0aa9815bd29d7c96cfa1761b2e00acd69e53e
        max_rounds: 32
        after_accept: retain
      next: confirm-final-review-route-binding
