          items:
            - audit-result
            - audit-summary
            - confirmed-gap-count
            - blocking-gap-count
            - eligible-low-gap-count
            - confirmation-needed-gap-count
            - blocking-rework-authority
        - node: re-audit
          required: false
          items:
            - audit-result
            - audit-summary
            - confirmed-gap-count
            - blocking-gap-count
            - eligible-low-gap-count
            - confirmation-needed-gap-count
            - blocking-rework-authority
        - node: record-audit-low-basis
