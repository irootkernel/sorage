  remediation-group-settlement-record:
    type: action
    title: Settle one accepted correction group
    intent: Settle one accepted correction group
    instructions:
      - The Primary accepts only the exact applicable Worker/Judge group candidate under existing correction authority and invokes aquarium:task-commit for that single actual diff. Workers cannot accept, stage or commit.
      - Verify actual post-hook commit bytes and residue before recording success. Carry every earlier verified group from native history and original commit evidence, then serialize the next group in dependency order within this same Validation session.
