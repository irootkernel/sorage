        help: Verify exact accepted current group scope and applicable unconsumed grant, authorized task-commit handoff, actual post-hook commit bytes equal the accepted candidate, commit identity and owner attribution, required checks, residue and prior verified groups. No Worker acceptance or commit assertion suffices.
        required: true
