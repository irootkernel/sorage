        min_length: 1
        max_length: 5000
        multiline: true
  judge-assessment-record:
    type: action
    title: Assess the current candidate
    intent: Obtain the retained report-only Judge assessment of original criteria and exact evidence.
    instructions:
      - Supply all original Epic exit criteria, member obligations, integration seams, purpose and original artifacts directly to the fresh cold Judge or retained internal Epic Judge. A Worker summary and inherited verdict never replace direct evidence.
