        required: true
        operation_id: aquarium-validation-judge-applicability
        operation_digest: sha256:ad3371ef8a2d6a4bb4bafac1e33ed131f1b9d46fbd8be4781d0e898b4b8ac776
        accepted_outcomes:
          - pass
          - fail
          - inconclusive
      - id: judge-summary
        type: text
        prompt: Record criterion rows, original sources, evidence gaps, applicable parent constraints, technical-review limitations, remaining authority, and proposed correction or evidence owner.
        required: true
        min_length: 1
        max_length: 4000
        multiline: true
      - id: judge-goal-outcome
        type: choice
        prompt: Record the exact final goal outcome; explicit stopped paths cannot be achieved.
        required: true
        choices:
          - achieved
          - not-achieved
          - superseded
          - stopped
